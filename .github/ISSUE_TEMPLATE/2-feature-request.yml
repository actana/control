name: ✨ Feature Request
description: Propose a new feature or enhancement. Significant features may require an RFC/design discussion first.
title: "feat: <short description>"
labels: ["type: feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please **search existing issues and discussions**.
        Large or breaking proposals should start as a Discussion so the design can be agreed before implementation work begins.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues/discussions and this is not a duplicate
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Describe the pain point, not the solution.
      placeholder: "As a <user type>, I need to <goal>, but currently <obstacle>."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you'd like, including API/UX sketches if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why they are less suitable.
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: Is this a breaking change?
      options:
        - "No"
        - "Yes – requires a major version bump"
        - "Unsure"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, screenshots, references to similar features elsewhere.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this feature and submit a PR
