name: Images Edge

# Publishes the unreleased container images from main, so anyone can try what
# is about to ship without waiting for a version tag:
#
#   :edge          always the latest main
#   :sha-<short>   the immutable pin for that exact commit
#
# Same build, same smoke test, same registries as a release
# (container-image.yml) — the only difference is which tags come out the other
# end. Nothing here moves :latest; that stays the property of a version tag.
#
# `paths-ignore` keeps a docs-only merge from rebuilding four container images.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".scratch/**"
      - "designs/**"
  workflow_dispatch:

concurrency:
  group: images-edge
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    name: Resolve tags
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - id: tags
        env:
          SHA: ${{ github.sha }}
        run: echo "tags=edge sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"

  panel:
    name: Panel image
    needs: resolve
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image: panel
      ref: ${{ github.sha }}
      stage: edge
      tags: ${{ needs.resolve.outputs.tags }}
      push: true

  core:
    name: Core image
    needs: resolve
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image: core
      ref: ${{ github.sha }}
      stage: edge
      tags: ${{ needs.resolve.outputs.tags }}
      push: true
