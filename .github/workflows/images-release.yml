name: Images Release

# Publishes the container images for a version tag — the Panel web service and
# the Core daemon. One image each, no installers, no signing (ADR 0010);
# the Core tarballs ship from core-release.yml on the same tag.
#
# The build/smoke/publish machinery lives in container-image.yml, shared with
# the PR build and the edge build, both in ci.yml. All this
# workflow adds is the version tag: validate it, then ask for :<version> and
# :latest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build the images for (e.g. v0.1.0). Must already exist on origin."
        required: true

concurrency:
  group: images-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    name: Resolve ref
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      version: ${{ steps.ref.outputs.version }}
      tags: ${{ steps.ref.outputs.tags }}
    steps:
      - id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ref="$INPUT_TAG"
          else
            ref="$REF_NAME"
          fi
          if [[ ! "$ref" =~ ^v[0-9]+([.][0-9]+){0,2}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "release ref must be a version tag like v0.1.0" >&2
            exit 1
          fi
          version="${ref#v}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A prerelease tag (v1.0.0-rc.1) must not move :latest.
          if [[ "$version" == *-* ]]; then
            echo "tags=$version" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$version latest" >> "$GITHUB_OUTPUT"
          fi

  panel:
    name: Panel image
    needs: resolve
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image: panel
      ref: ${{ needs.resolve.outputs.ref }}
      stage: ${{ needs.resolve.outputs.version }}
      tags: ${{ needs.resolve.outputs.tags }}
      push: true

  core:
    name: Core image
    needs: resolve
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image: core
      ref: ${{ needs.resolve.outputs.ref }}
      stage: ${{ needs.resolve.outputs.version }}
      tags: ${{ needs.resolve.outputs.tags }}
      push: true
