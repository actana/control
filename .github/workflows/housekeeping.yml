name: Housekeeping

# The third and last workflow (ADR 0016 D34), and the one that is not a check.
#
# Seven chores on two schedules. What they have in common is not their subject —
# they share nothing — but their relationship to a pull request: **none of them
# gates one, and none of them can be caused or fixed by one.** That is the whole
# reason they are here rather than in `ci.yml`.
#
#   stale             daily   labels and closes an inactive issue or PR
#   base-pins         weekly  opens the NODE_VERSION bump PR, reports digest drift
#   release-detector  weekly  base drift or a new fixable CVE in a released
#                             image — opens an issue, publishes nothing
#   dev-tag-sweep     weekly  deletes stale `pr-*` / `sha-*` tags from the two
#                             `-dev` repositories
#   descriptions      weekly  syncs the four Docker Hub pages from docs/images/
#   dev-audit         weekly  `pnpm audit` over the dev tree — opens an issue
#   harness-canary    weekly  the vendors' real installers — opens an issue
#
# Three of them deliberately end in `gh issue create` rather than a red run.
# `dev-audit` (ADR 0016 D37) is red for advisories in packages that never ship,
# `harness-canary` (D38) is red when a vendor changes their installer, and
# `release-detector` (ADR 0023 D42) is red when a base image someone else
# maintains grows a CVE — none is payable by the person whose PR happens to be
# open, and a permanently red scheduled workflow is how a team learns that red
# means nothing.
#
# Eight jobs, seven chores: `release-ref` is `release-detector`'s resolver
# rather than a chore of its own — it is a separate job only because a matrix
# job cannot run a step to work out its own inputs.
#
# **Nothing here publishes.** Until ADR 0023 this file rebuilt the newest
# release every Monday and pushed over `:<version>` and `:latest`, which under
# digest promotion would overwrite a promoted digest with bytes no beta
# contained and no human approved — while the `revision` label still named the
# promoted commit, so the promotion assertion (D16) would keep passing against
# changed bytes. The immutability claim would have survived about seven days.
# The rebuild is now a detector: it finds the same things and files an issue,
# and the patch ships through a hotfix train like any other change (D42).
#
# `base-pins` was `base-pins.yml`; `stale` was `stale.yml`. Both are folded in
# here rather than kept as files of their own, because D34's count is entry
# points: `ci`, `release`, `housekeeping`, plus `container-image.yml` as a
# reusable workflow. A weekly cron that opens a PR is housekeeping by
# definition, and the alternative was two more files that `ls
# .github/workflows` has to explain.
#
# Jobs are gated on `github.event.schedule`, which is how one file carries two
# cadences: a job with the daily cron in its `if:` does not run on the weekly
# tick. `workflow_dispatch` names one chore, or `weekly` for the four that share
# the Monday tick — see `scripts/__tests__/workflows.test.mjs`, which reads this
# file and asserts each job is on the cron it claims.

on:
  schedule:
    # Daily, off-peak. Carried across from stale.yml unchanged.
    - cron: "17 3 * * *"
    # Mondays at 07:00 UTC. Weekly rather than nightly for the base check
    # (D10): Canonical does not ship security updates nightly, and a nightly
    # sweep of a registry is a property of a vendor's build farm, not something
    # worth imitating here.
    #
    # The time is base-pins' and the reason is base-pins': it is after the 06:00
    # Europe/Berlin the `docker` entry in .github/dependabot.yml is scheduled
    # for (05:00 UTC in winter, 04:00 in summer). Ordering matters only for the
    # reporting — a digest Dependabot has just opened a PR for should not also
    # be listed here as one nobody has moved.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      chore:
        description: "Which chore to run. `weekly` runs the six on the Monday tick."
        type: choice
        default: weekly
        options:
          - weekly
          - stale
          - base-pins
          - release-detector
          - dev-tag-sweep
          - descriptions
          - dev-audit
          - harness-canary
      dry-run:
        description: "`dev-tag-sweep` only: decide and report, delete nothing."
        type: boolean
        default: false

# Serialised, never cancelled: a run that is halfway through deleting tags must
# finish rather than leave a `-dev` repository half swept, and a stale sweep
# that is skipped is a day of backlog nobody swept.
concurrency:
  group: housekeeping
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ------------------------------------------------------------------ daily

  # Keeps the backlog honest: marks inactive issues/PRs stale, then closes them.
  # Issues labeled `pinned` or `security` are never touched.
  stale:
    name: Stale issues and PRs
    if: >-
      github.event.schedule == '17 3 * * *'
      || (github.event_name == 'workflow_dispatch' && inputs.chore == 'stale')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,blocked,needs-info"
          exempt-pr-labels: "pinned,security,blocked"
          stale-issue-message: >
            This issue has been automatically marked as stale due to 60 days of
            inactivity. It will be closed in 14 days unless there is new activity.
            If this is still relevant, please comment or remove the stale label.
          stale-pr-message: >
            This PR has been automatically marked as stale due to 30 days of
            inactivity. It will be closed in 14 days unless there is new activity.
            Please rebase and address review feedback, or convert to draft.

  # ----------------------------------------------------------------- weekly

  # ADR 0016 D10's second and third mechanisms. Which pin is whose job, and why
  # a checker exists alongside the Dependabot config at all, is written up once
  # in docs/ci-cd.md § "The image bases, and what moves them" — this job
  # implements that split rather than re-arguing it:
  #
  #   opens PRs for   `ARG NODE_VERSION`, which is a nodejs.org tarball (D8) and
  #                   so invisible to Dependabot's docker ecosystem
  #   reports only    the two base digests, which are Dependabot's to open PRs
  #                   for; two bots racing on one PR is worse than one bot
  #   not here        the same question asked of the *released* images, which is
  #                   `release-detector` below. This job looks at the working
  #                   tree; that one looks at what operators are running.
  #
  # One correction worth carrying, because the wording is easy to repeat: D10
  # calls the NODE_VERSION bump "the only thing that clears the Node-attributed
  # findings", and D10's own amendment measured that false — no released Node 24
  # ships a clean bundled npm, and D11's amendment scopes that tree out of the
  # gate. The bump is worth making for Node's own security fixes, not the gate.
  base-pins:
    name: Check the image bases and NODE_VERSION
    if: >-
      github.event.schedule == '0 7 * * 1'
      || (github.event_name == 'workflow_dispatch'
          && contains(fromJSON('["weekly","base-pins"]'), inputs.chore))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      # No `pnpm install`: the checker is dependency-free on purpose, so a
      # broken lockfile cannot be the reason nobody hears about a stale base.
      #
      # Exactly one invocation, and it does all three jobs — prints the table,
      # writes this step's outputs, and applies the NODE_VERSION bump to the
      # working tree. A second invocation would re-resolve every pin over the
      # network and could disagree with the first if a digest moved in between.
      # `--fix-node` runs unconditionally because it is a no-op when nothing has
      # drifted, and the tree is thrown away with the runner if no PR follows.
      #
      # Deciding what "drifted" means, and whose job each pin is, stays inside
      # the checker where it is tested — re-deriving it from the JSON in shell
      # would give it a second, untested definition.
      - name: Resolve every pin against its upstream
        id: check
        run: |
          set -euo pipefail

          {
            echo "### Pins"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/check-base-pins.mjs \
            --fix-node \
            --github-output "$GITHUB_OUTPUT" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Report-only, and the wording matters: this is not a failure, it is
      # Dependabot's PR being late or absent. Someone reading the run should
      # know which of those to go and check.
      - name: Note any digest Dependabot has not moved
        if: steps.check.outputs.digest-drift != ''
        env:
          DRIFTED: ${{ steps.check.outputs.digest-drift }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### Digests behind upstream"
            echo ""
            echo "\`$DRIFTED\` — these are Dependabot's to bump (.github/dependabot.yml, \`docker\`)."
            echo "If no PR is open for them, check the updater's own log at"
            echo "\`https://github.com/$GITHUB_REPOSITORY/network/updates\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open the NODE_VERSION bump
        if: steps.check.outputs.node-drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.node-latest }}
          CURRENT: ${{ steps.check.outputs.node-current }}
        run: |
          set -euo pipefail

          # `chore/`, not `build/`: the branch-name check in ci.yml
          # does not list `build` as a branch type, and a bot cannot retitle
          # its own branch after the fact. The *commit* is still `build(...)`,
          # which is the part commitlint reads.
          branch="chore/node-version-${LATEST//./-}"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A PR for $branch is already open — nothing to do."
            exit 0
          fi

          # The bump itself is already in the working tree — the check step
          # applied it. This step only turns it into a branch and a PR.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "build(core-image): bump NODE_VERSION to ${LATEST}"
          git push --force-with-lease origin "$branch"

          # --body-file rather than an inline heredoc: this block is already
          # inside a YAML block scalar, and nesting a heredoc's terminator
          # inside one is the kind of thing that survives review and then
          # breaks on the first run nobody is watching.
          {
            echo "Node ${CURRENT} → ${LATEST} in \`deploy/core.Dockerfile\`."
            echo ""
            echo "Opened by the \`base-pins\` job in \`.github/workflows/housekeeping.yml\`, which"
            echo "owns this pin because it is a nodejs.org tarball rather than an image reference,"
            echo "so Dependabot's \`docker\` ecosystem cannot see it (ADR 0016 D8, D10)."
            echo ""
            echo "The tarball is SHA-256 verified against that release's own \`SHASUMS256.txt\`"
            echo "inside the build, so a wrong version fails the image build rather than shipping."
            echo ""
            echo "**Checks do not run on this PR.** It is pushed with \`GITHUB_TOKEN\`, and GitHub"
            echo "deliberately does not trigger workflows from it. Close and reopen the PR to get a"
            echo "full run before merging."
          } > "$RUNNER_TEMP/pr-body.md"

          # No `--label`: every label this PR could want has to exist on the
          # repo already, and `gh pr create` fails outright on one that does
          # not — which would mean the bump is never opened at all. Labelling is
          # triage's job and triage can see the branch name.
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch" \
            --title "build(core-image): bump NODE_VERSION to ${LATEST}" \
            --body-file "$RUNNER_TEMP/pr-body.md"

  # `release-detector`'s resolver. A job rather than a step because a matrix
  # job cannot compute its own inputs, and both matrix legs need the same
  # answer — resolving it twice would let the two legs disagree if a release
  # were published in between.
  release-ref:
    name: Resolve the released version to inspect
    if: >-
      github.event.schedule == '0 7 * * 1'
      || (github.event_name == 'workflow_dispatch'
          && contains(fromJSON('["weekly","release-detector"]'), inputs.chore))
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `--exclude-pre-releases` is the same invariant D9 depends on
          # elsewhere: a beta is Docker-only and never becomes a GitHub
          # Release, so the newest non-prerelease Release *is* the newest thing
          # an operator can be running.
          ref="$(gh release list \
            --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')"

          if [[ -z "$ref" ]]; then
            # Before 0.1.0 this is the normal answer, not a failure: there is
            # no released image for anything to have rotted underneath.
            echo "::notice title=Nothing to inspect::No published release yet."
            exit 0
          fi

          version="${ref#v}"
          echo "Inspecting $ref → :$version"
          {
            echo "ref=$ref"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  # The weekly rebuild, as a detector (ADR 0023 D42).
  #
  # It used to rebuild the newest release and push over `:<version>` and
  # `:latest` — which under digest promotion overwrites a promoted digest with
  # bytes no beta contained and no human approved, while the `revision` label
  # still names the promoted commit so D16's assertion keeps passing against
  # changed bytes. **It publishes nothing now.** It asks the two questions the
  # rebuild used to answer by doing, and files an issue:
  #
  #   has the base moved?     the released tag's `FROM` digest against what
  #                           upstream serves for that tag today
  #   has it rotted?          Trivy over the published image, fixable
  #                           CRITICAL/HIGH only
  #
  # Both images, not just Core. Core-only was an accident of how this grew: the
  # argument was that the Panel is distroless and collects nothing from an
  # `apt-get upgrade` that does not exist there — true of a *rebuild*, and
  # irrelevant to a detector. A Chainguard base that moves under a released
  # Panel is exactly as worth knowing about.
  #
  # The accepted trade (D42): a base-image CVE now costs a patch release and a
  # person, instead of a silent Monday mutation of `:latest`. The patch ships
  # through a hotfix train (D22) like any other change.
  #
  # Unfixable findings are deliberately not reported. ADR 0016 D11 is explicit:
  # unfixed findings do not gate, because a report nobody can act on teaches
  # everyone to ignore the ones they can. `scan-core-image.mjs` already draws
  # that line and is tested where it is drawn.
  release-detector:
    name: Released image detector (${{ matrix.image }})
    needs: release-ref
    if: needs.release-ref.outputs.ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      # Independent questions about independent images: a Core finding must not
      # cancel the Panel's scan.
      fail-fast: false
      matrix:
        image: [panel, core]
    steps:
      # The *released* tag, not the default branch. The pins that built the
      # image an operator is running are the ones in that commit's Dockerfile;
      # `main`'s may already have moved, which is `base-pins`' question, not
      # this one.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-ref.outputs.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      # No `pnpm install` here either, and for the same reason as `base-pins`:
      # both checkers are dependency-free so a broken lockfile cannot be why
      # nobody hears about a rotted release.
      - name: Has this image's base moved since the release?
        id: bases
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          node scripts/check-base-pins.mjs --json "$RUNNER_TEMP/pins.json" | tee "$RUNNER_TEMP/pins.txt"

          # This image's Dockerfile only, and only its `FROM` pins: the
          # NODE_VERSION row is a nodejs.org tarball rather than a base image
          # (`kind: tarball`), it is `base-pins`' to open a PR for, and a new
          # Node release is not a reason to tell anyone their release rotted.
          #
          # Joined onto one line rather than emitted as a heredoc output: a
          # step output that is "one empty line" and one that is "the empty
          # string" are the same thing to the `!= ''` below, and betting the
          # difference on GitHub's heredoc trimming is not worth the two lines
          # it would save. A Dockerfile has one or two `FROM` pins.
          drift="$(jq -r --arg file "deploy/${IMAGE}.Dockerfile" \
            '[.rows[] | select(.file == $file and .kind != "tarball" and .upstream != null and .pinned != .upstream)
              | "\(.label): \(.pinned) → \(.upstream)"] | join("; ")' \
            "$RUNNER_TEMP/pins.json")"

          echo "drifted=$drift" >> "$GITHUB_OUTPUT"

      # Pinned by version and checked against that release's own published
      # checksums — the same "a download we verify, not a publisher we trust"
      # posture core.Dockerfile takes with Node (D8), and the reason this is
      # not `curl … | sh`. Pinning also pins the *scanner*, so a finding count
      # moves only when a deliberate bump moves it.
      #
      # Duplicated from container-image.yml rather than shared: that file is a
      # `workflow_call` reusable workflow, which cannot lend a single step to a
      # caller, and a composite action would be a fifth entry point in a
      # directory whose count D34 fixes at four.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.73.0
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          dist="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$dist/$archive"
          curl -fsSLO "$dist/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${archive}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p bin && tar -xzf "$archive" -C bin trivy

      # Against the published image, pulled from the registry — not against a
      # rebuild. The whole point is to grade the bytes operators actually have.
      #
      # `scan-core-image.mjs` is named for the image it was written against and
      # is image-agnostic: it grades a Trivy document with the classification in
      # scripts/lib/image-cve-gate.mjs, which knows about fixable-vs-unfixed and
      # nothing about Core. The suppression assertion inside it is a no-op on a
      # distroless image, which has no `linux-libc-dev` to suppress.
      - name: Trivy — fixable CRITICAL/HIGH in the released image
        id: scan
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.release-ref.outputs.version }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          namespace="${DOCKERHUB_NAMESPACE:-${OWNER,,}}"
          ref="docker.io/${namespace,,}/${IMAGE}:${VERSION}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

          PATH="$RUNNER_TEMP/bin:$PATH" node scripts/scan-core-image.mjs \
            --image "$ref" --json "$RUNNER_TEMP/trivy.json" \
            > "$RUNNER_TEMP/scan.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/scan.log"

          # A non-zero exit means one of two very different things, and they
          # must not be conflated: gating findings — which are news for an
          # issue — or a scanner that could not run, which is a broken job and
          # belongs red. Trivy having written a report at all separates them,
          # and the gate's own wording confirms which side we are on.
          if [[ ! -s "$RUNNER_TEMP/trivy.json" ]]; then
            echo "::error title=Scanner error::trivy produced no report for $ref"
            exit 1
          fi
          if [[ $status -eq 0 ]]; then
            echo "findings=false" >> "$GITHUB_OUTPUT"
          elif grep -q "fixable CRITICAL/HIGH finding" "$RUNNER_TEMP/scan.log"; then
            echo "findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Scan failed::$ref could not be graded — see the log above."
            exit 1
          fi

      - name: Report
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.release-ref.outputs.version }}
          DRIFTED: ${{ steps.bases.outputs.drifted }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
        run: |
          set -euo pipefail
          {
            echo "### ${IMAGE} ${VERSION}"
            echo ""
            echo "Base drift: ${DRIFTED:-none}"
            echo ""
            echo "Fixable CRITICAL/HIGH: ${FINDINGS:-unknown}"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/scan.log" 2>/dev/null || echo "(the scan did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue for the released image
        if: steps.bases.outputs.drifted != '' || steps.scan.outputs.findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.release-ref.outputs.version }}
          REF: ${{ steps.scan.outputs.ref }}
          DRIFTED: ${{ steps.bases.outputs.drifted }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # One open issue per released image, which is the granularity of the
          # *remedy* rather than of the finding: base drift and three new CVEs
          # in `actana/core:0.1.0` are all cleared by one patch release, so
          # filing them separately would be three issues one pull request
          # closes. Re-running weekly against something nobody has got to yet
          # is therefore silent — the run link on the original finds the latest
          # output — while a closed issue means someone decided it was handled,
          # so a fresh recurrence deserves a fresh issue.
          #
          # The version is in the title on purpose: once the patch ships, the
          # next Monday asks about a different release and gets a new issue.
          TITLE="Released image needs a patch: ${IMAGE} ${VERSION}"
          open="$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [[ -n "$open" ]]; then
            echo "::notice title=Already tracked::#$open is open for this. Not filing another."
            exit 0
          fi

          {
            echo "\`$REF\` — the image operators are running — has moved out from under its release."
            echo ""
            if [[ -n "$DRIFTED" ]]; then
              echo "**The base image moved.** The digest \`deploy/${IMAGE}.Dockerfile\` pinned at"
              echo "\`v${VERSION}\` is no longer what that tag serves:"
              echo ""
              echo '```'
              echo "$DRIFTED"
              echo '```'
              echo ""
            fi
            if [[ "$FINDINGS" == "true" ]]; then
              echo "**Trivy found fixable CRITICAL/HIGH findings** in the published image."
              echo "Unfixed findings are excluded deliberately (ADR 0016 D11) — they do not gate,"
              echo "because a report nobody can act on teaches everyone to ignore the ones they can."
              echo ""
              echo '```'
              tail -n 60 "$RUNNER_TEMP/scan.log"
              echo '```'
              echo ""
            fi
            echo "**Nothing was rebuilt and nothing was published** (ADR 0023 D42). A weekly rebuild"
            echo "that pushed over \`:${VERSION}\` and \`:latest\` would overwrite a promoted digest"
            echo "with bytes no beta contained and no human approved, while the \`revision\` label"
            echo "still named the promoted commit — so the promotion assertion (D16) would keep"
            echo "passing against changed bytes."
            echo ""
            echo "The fix ships as a patch release through a hotfix train (D22): cut"
            echo "\`beta/<next patch>\` from \`main\`, bump the pin, promote."
            echo ""
            echo "[Run]($RUN_URL)"
          } > "$RUNNER_TEMP/issue.md"

          # `needs-triage` and nothing else. `gh issue create` fails outright on
          # a label the repo does not have, which would turn "open an issue"
          # into the red run this job exists to avoid.
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md" \
            --label needs-triage

  # The `-dev` tag sweep (ADR 0023 D33).
  #
  # Docker Hub has no automatic tag garbage collection, so every push to every
  # pull request leaves a tag behind forever. This is the clock that empties
  # `panel-dev` and `core-dev`.
  #
  # It is the only destructive unattended job in the repository, against a
  # registry with **no undelete**, and D38's two independent guards on that are
  # not both available: Docker Hub personal access tokens carry an account-wide
  # permission level rather than a repository list, so
  # `DOCKERHUB_CLEANUP_TOKEN` can delete from `actana/panel` and `actana/core`
  # as well. See the ADR's D38 amendment. The hard-coded allowlist in
  # `scripts/lib/dev-tag-sweep.mjs` is therefore load-bearing rather than
  # defence in depth: it is exact-match, it is re-asserted immediately before
  # every delete call, it refuses to run when empty, and it is unit-tested
  # against a release repository being handed to it by name.
  #
  # The credential is a *second* token, not the one the image push uses. That
  # is the point: the push credential never gains delete, and the delete
  # credential never appears in a job that touches a release repository.
  dev-tag-sweep:
    name: Sweep the -dev image tags
    if: >-
      github.event.schedule == '0 7 * * 1'
      || (github.event_name == 'workflow_dispatch'
          && contains(fromJSON('["weekly","dev-tag-sweep"]'), inputs.chore))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The sweep asks which pull requests are still open before deleting their
      # images. It never writes one.
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      # No `pnpm install`: the sweep uses `fetch` and nothing else, so a broken
      # lockfile cannot be the reason a registry stops being swept.
      - name: Sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_CLEANUP_TOKEN: ${{ secrets.DOCKERHUB_CLEANUP_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_CLEANUP_TOKEN:-}" ]]; then
            # A fork, or a repository where section 2 of docs/REPO_SETUP.md has
            # not been done. Not a failure: there is nothing to sweep and no
            # credential to sweep it with.
            echo "::notice title=Sweep skipped::DOCKERHUB_CLEANUP_TOKEN is not set. See docs/REPO_SETUP.md section 2."
            exit 0
          fi

          # An array rather than an interpolated string: `--dry-run` is the
          # difference between a report and an irreversible delete, and word
          # splitting is not a mechanism to trust with that.
          extra=()
          if [[ "${DRY_RUN:-false}" == "true" ]]; then extra+=(--dry-run); fi

          namespace="${DOCKERHUB_NAMESPACE:-${OWNER,,}}"
          node scripts/sweep-dev-tags.mjs \
            --namespace "${namespace,,}" \
            --github-repo "$GITHUB_REPOSITORY" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${extra[@]}"

  # The four Docker Hub pages (ADR 0023 D43).
  #
  # Docker Hub does not pull a README from GitHub on its own — the repository
  # description is a field you PATCH through its API. This syncs one file per
  # image, so each repository gets its own page rather than sharing the source
  # repo's README (which describes the project rather than any of them).
  #
  #   docs/images/panel.md      → docker.io/<ns>/panel
  #   docs/images/core.md       → docker.io/<ns>/core
  #   docs/images/panel-dev.md  → docker.io/<ns>/panel-dev
  #   docs/images/core-dev.md   → docker.io/<ns>/core-dev
  #
  # It lived in `release.yml`, gated on the two release image publishes (ADR
  # 0016 D33), because a page must not describe a version nobody can pull. That
  # rationale does not survive the move and is not carried with it: the `-dev`
  # pages have nothing to do with a release, and a page describing the version
  # *before* the current one is a smaller problem than four pages that drift
  # until someone happens to cut a release. On a weekly tick the drift is
  # self-healing on all four, and a typo is fixed by merging the fix — the next
  # Monday publishes it, or `gh workflow run housekeeping.yml -f
  # chore=descriptions` does it now.
  #
  # Done with curl rather than a third-party action on purpose: this step
  # handles a credential that can rewrite the public face of four images, and
  # the repo pins every action it does trust by SHA.
  descriptions:
    name: Docker Hub descriptions
    if: >-
      github.event.schedule == '0 7 * * 1'
      || (github.event_name == 'workflow_dispatch'
          && contains(fromJSON('["weekly","descriptions"]'), inputs.chore))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Push each image's README to Docker Hub
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          OWNER: ${{ github.repository_owner }}
          # The same one PAT the image push uses — *not* the cleanup token.
          # Descriptions are a write to a page, not a delete.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$DOCKERHUB_TOKEN" || -z "$DOCKERHUB_USERNAME" ]]; then
            echo "::notice title=Docker Hub descriptions skipped::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set. See docs/REPO_SETUP.md section 2."
            exit 0
          fi

          namespace="${DOCKERHUB_NAMESPACE:-${OWNER,,}}"
          namespace="${namespace,,}"

          # A JWT, not the token itself — the /v2/repositories/ endpoints do not
          # accept a raw PAT.
          jwt="$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}' \
            | curl -sS -X POST -H 'Content-Type: application/json' -d @- \
                https://hub.docker.com/v2/users/login/ \
            | jq -r '.token // empty')"

          if [[ -z "$jwt" ]]; then
            echo "::error title=Docker Hub auth failed::Could not exchange DOCKERHUB_USERNAME/DOCKERHUB_TOKEN for a JWT. This endpoint rejects organization access tokens ('Cannot log into an organization account') — use a PERSONAL access token with Read & Write scope, from an account with Admin on the org. That one token serves the image push as well."
            exit 1
          fi

          # short: what shows in search results. full: the page body.
          # Docker Hub caps these at 100 and 25000 bytes; overflowing is a 400,
          # so fail with the length rather than a bare API error.
          sync() {
            local repo="$1" file="$2" short="$3"
            if [[ ! -f "$file" ]]; then
              echo "::error title=Missing description file::$file"
              return 1
            fi
            # Byte length, not ${#short}: that counts characters, and these
            # strings contain multibyte punctuation. Docker's limit is bytes.
            local short_bytes bytes
            short_bytes="$(printf '%s' "$short" | wc -c)"
            if (( short_bytes > 100 )); then
              echo "::error title=Short description too long::$repo is $short_bytes bytes, max 100"
              return 1
            fi
            bytes="$(wc -c < "$file")"
            if (( bytes > 25000 )); then
              echo "::error title=README too long::$file is $bytes bytes, max 25000"
              return 1
            fi

            local status
            status="$(jq -n --rawfile full "$file" --arg short "$short" \
                        '{full_description:$full, description:$short}' \
              | curl -sS -o /tmp/resp.json -w '%{http_code}' \
                  -X PATCH \
                  -H "Authorization: JWT $jwt" \
                  -H 'Content-Type: application/json' \
                  -d @- \
                  "https://hub.docker.com/v2/repositories/${namespace}/${repo}/")"

            if [[ "$status" != "200" ]]; then
              echo "::error title=Failed to update $repo::HTTP $status — $(cat /tmp/resp.json)"
              return 1
            fi
            echo "✅ ${namespace}/${repo} — $bytes bytes of README, short description set"
          }

          # All four are attempted before the run fails, so one broken page does
          # not hide the state of the other three.
          rc=0
          sync panel docs/images/panel.md \
            "Self-hosted web Panel for driving agentic coding work across your machines." || rc=1
          sync core docs/images/core.md \
            "The Actana Core daemon: the machine your agentic coding sessions actually run on." || rc=1
          sync panel-dev docs/images/panel-dev.md \
            "Pre-merge Panel builds. Not released, not scanned-clean — do not deploy." || rc=1
          sync core-dev docs/images/core-dev.md \
            "Pre-merge Core builds. Not released, not scanned-clean — do not deploy." || rc=1
          exit "$rc"

  # The second of D37's three populations. `ci.yml`'s `dependency-audit` runs
  # `--prod`, which is the graph that reaches an operator; this is everything
  # else — the build tooling, the test harness, the linters.
  #
  # It opens an issue instead of gating because the two populations fail
  # differently. A high in the shipped graph is a bug in something we ship and
  # the PR in front of it can be held. A high in `brace-expansion` under
  # `vitest` ships nowhere, is nobody's PR to have caused, and is frequently
  # nobody's PR to be able to fix — gating on it teaches everyone to click past
  # a red check, which then also covers the one that mattered.
  dev-audit:
    name: Weekly dependency audit (dev tree)
    if: >-
      github.event.schedule == '0 7 * * 1'
      || (github.event_name == 'workflow_dispatch'
          && contains(fromJSON('["weekly","dev-audit"]'), inputs.chore))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `--prod`, which is the whole point of this job — see above.
      #
      # The exit status is captured rather than allowed to fail the step: a red
      # scheduled run is the outcome this job exists to *avoid*, so the finding
      # has to travel by issue instead.
      - name: pnpm audit --audit-level high
        id: audit
        run: |
          set -uo pipefail
          if pnpm audit --audit-level high > "$RUNNER_TEMP/audit.txt" 2>&1; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/audit.txt"
          {
            echo "### \`pnpm audit --audit-level high\` (dev tree)"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue for the advisories
        if: steps.audit.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Weekly dev-tree audit: high or critical advisories"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # One open issue at a time. Re-running weekly against an advisory
          # nobody has got to yet should be silent, not a new issue every
          # Monday — the run link on the original is enough to find the latest
          # output, and a closed issue means someone decided it was handled, so
          # a fresh recurrence deserves a fresh issue.
          open="$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [[ -n "$open" ]]; then
            echo "::notice title=Already tracked::#$open is open for this. Not filing another."
            exit 0
          fi

          {
            echo "\`pnpm audit --audit-level high\` over the **dev** tree reported findings."
            echo ""
            echo "This does not gate a pull request and it is not a release blocker on its own"
            echo "(ADR 0016 D37): these are packages that never reach an operator. The shipped"
            echo "graph is audited with \`--prod\` on every PR, and the image's own layers are"
            echo "Trivy's."
            echo ""
            echo "[Run]($RUN_URL)"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"

          # `needs-triage` and nothing else. `gh issue create` fails outright on a
          # label the repo does not have, which would turn "open an issue" into
          # the red run this job exists to avoid — and the repo's live label set
          # and the bootstrap in docs/REPO_SETUP.md do not agree on much beyond
          # this one.
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md" \
            --label needs-triage

  # The vendor canary (D38). "A vendor changed their installer and `actana
  # harnesses install <id>` no longer leaves a CLI on PATH" is worth catching —
  # it is what `e2e-actana-harnesses-linux.mjs` asserts, against four vendors'
  # real installers over the real network.
  #
  # It is deliberately non-hermetic, which is exactly why it is here and not in
  # `ci.yml`: no PR can cause this failure and no PR author can fix it. Gating a
  # PR on it is how a team learns that red means nothing.
  #
  # This is the one place in the test suite where the word Harness legitimately
  # survives the rename — it is a vendor's product being installed, not ours.
  harness-canary:
    name: Weekly Harness-install canary
    if: >-
      github.event.schedule == '0 7 * * 1'
      || (github.event_name == 'workflow_dispatch'
          && contains(fromJSON('["weekly","harness-canary"]'), inputs.chore))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # From `main`, not from the released tarball: what is under test is the
      # install path in the code as it stands now, so that a vendor move shows
      # up here the week it happens rather than the week after a release.
      - name: Build the tarball
        run: pnpm core:tarball

      - name: Canary — the vendors' own installers, on a fresh systemd machine
        id: canary
        run: |
          set -uo pipefail
          tarball="$(find artifacts/core -name 'actana-core-*-linux-x64.tar.gz' | head -n1)"
          if [[ -z "$tarball" ]]; then
            echo "no linux-x64 tarball was built" >&2
            exit 1
          fi
          if node scripts/e2e-actana-harnesses-linux.mjs --tarball "$tarball" \
               > "$RUNNER_TEMP/canary.log" 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/canary.log"

      - name: Open an issue for the vendor break
        if: steps.canary.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Harness-install canary is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          open="$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [[ -n "$open" ]]; then
            echo "::notice title=Already tracked::#$open is open for this. Not filing another."
            exit 0
          fi

          # Tail, not the whole log: a failed run of this script is thousands of
          # lines of four vendors' installers, and the assertion that failed is
          # at the end. The full log is on the run.
          {
            echo "\`actana harnesses install <id>\` no longer does what a vendor's installer"
            echo "used to leave behind. This is a vendor-side change, not a regression a pull"
            echo "request caused (ADR 0016 D38) — which is why it arrives as an issue rather"
            echo "than a red check."
            echo ""
            echo "Reproduce locally: \`pnpm core:tarball && pnpm core:harnesses:e2e --tarball <file>\`"
            echo ""
            echo "[Full log]($RUN_URL)"
            echo ""
            echo '```'
            tail -n 100 "$RUNNER_TEMP/canary.log"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"

          # `needs-triage` and nothing else. `gh issue create` fails outright on a
          # label the repo does not have, which would turn "open an issue" into
          # the red run this job exists to avoid — and the repo's live label set
          # and the bootstrap in docs/REPO_SETUP.md do not agree on much beyond
          # this one.
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md" \
            --label needs-triage
