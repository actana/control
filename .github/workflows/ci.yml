name: CI

on:
  pull_request:
    # The three defaults plus `ready_for_review` (#137), and named explicitly
    # because naming `types` at all *replaces* the defaults rather than
    # extending them — so the three have to be listed alongside the one this
    # adds. A draft resolves both image checks to `pass` (ADR 0023 D33), and
    # undrafting fires `ready_for_review`, which the defaults do not listen
    # for: no run started, the mode was never re-resolved, and the draft-time
    # greens stood — a mergeable pull request carrying two required image
    # checks that had never built its head, under the same check names a real
    # build reports under (D33), which is what made it invisible. The re-run
    # re-resolves the mode, and the resolver's draft branch reads `draft:
    # false` off the payload and builds.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      # The train, and nothing else (ADR 0023 D41). Nothing else in the
      # repository triggers on a train merge, so without this `beta-x.y.z` —
      # the tag the entire promotion depends on — would never be published.
      #
      # `main` is deliberately absent. Commits arrive there by a fast-forward
      # of a train whose every commit this workflow already gated and
      # published (D5), so a second run would re-prove what the train proved.
      # Its `paths-ignore` block went with it: that block existed so a
      # docs-only merge did not rebuild and republish `:edge`, and `:edge` is
      # retired (D13). There is no path filter here either, on purpose (D20) —
      # a docs-only merge that skipped the build would leave `beta-x.y.z`'s
      # revision label naming an older commit, and the promotion assertion
      # would then fail: a README fix would block the release.
      #
      # `landing.yml` keeps its own `push: main` trigger, which is what still
      # deploys the front door.
      - "beta/**"
  # Republishing a train's images without a new commit, for when a registry
  # was down or a run was cancelled. On a dispatch the gate jobs run too —
  # that is the cheap half, and a dispatch is rare.
  workflow_dispatch:

concurrency:
  # A train push must never cancel the one before it (ADR 0023 D7). `beta-x.y.z`
  # moves per merge, so two merges landing 30 seconds apart can finish out of
  # order and leave the moving tag on *older* bytes — silently, with both runs
  # green. `release.yml` and `housekeeping.yml` take `false` for exactly this
  # reason; a pull request keeps cancelling, because a superseded push has
  # nothing to publish and nobody is waiting on its check.
  group: ${{ startsWith(github.ref, 'refs/heads/beta/') && format('ci-train-{0}', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/beta/') }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The repo conventions, in one job (ADR 0016 D34):
  #   1. PR title follows Conventional Commits (it becomes the squash-merge subject)
  #   2. Every commit message in the PR follows Conventional Commits (commitlint)
  #   3. Branch name follows the branch naming convention
  #
  # These were three jobs in conventions.yml, two of which each `npm install`-ed
  # their own copy of commitlint — three copies of one 30-second setup to run a
  # couple of seconds of linting. One job, one install, one required check.
  #
  # The title check runs the PR title through the same commitlint.config.mjs the
  # commit check uses, rather than a third-party action. One rule set, one place
  # to change it, and no unpinned third-party code reading pull-request context.
  #
  # The title is read from the API at run time rather than from the event
  # payload. conventions.yml carried `types: [edited]` so that fixing a bad
  # title re-ran the check — a re-run replays the *original* payload, so
  # without it the check stays red until someone pushes a commit. Putting
  # `edited` on this workflow instead would re-run the entire gate on every
  # description edit, which is the opposite of what D35 is for. Asking GitHub
  # for the title as it is now buys the same property for one API call.
  #
  # commitlint is installed into RUNNER_TEMP, never into the checkout: this is a
  # pnpm workspace, and the root package.json declares `workspace:*` dependencies
  # that npm cannot parse ("EUNSUPPORTEDPROTOCOL"). Installing beside the config
  # copy keeps `extends: ['@commitlint/config-conventional']` resolvable, and
  # `--cwd` points commitlint back at the checkout for its git queries.
  conventions:
    name: Conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install commitlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/commitlint"
          cp commitlint.config.mjs "$RUNNER_TEMP/commitlint/"
          cd "$RUNNER_TEMP/commitlint"
          npm init -y >/dev/null
          npm install --silent @commitlint/cli @commitlint/config-conventional

      # Held in a shell variable and piped, never interpolated into the script
      # — a PR title is attacker-controlled text.
      #
      # Skipped on the promotion pull request, and only there (ADR 0023 D5,
      # D38). `main` advances by fast-forward, so a promotion produces no
      # squash commit and its title never becomes history — linting it would
      # bounce a required check over a string nothing will ever read. **Do not
      # make this strict again**: the promotion PR is opened by a workflow with
      # a subject describing a train, not a change. Commit linting below is
      # deliberately kept — the train's commits *are* what lands on `main`.
      - name: Lint the PR title
        if: ${{ !(github.base_ref == 'main' && startsWith(github.head_ref, 'beta/')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          title="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .title)"
          printf '%s' "$title" | "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" \
            --config "$RUNNER_TEMP/commitlint/commitlint.config.mjs" \
            --cwd "$GITHUB_WORKSPACE" --verbose

      - name: Lint commits in PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" \
            --config "$RUNNER_TEMP/commitlint/commitlint.config.mjs" \
            --cwd "$GITHUB_WORKSPACE" \
            --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Allowed: <type>/<kebab-case-description>
          # Examples: feat/proj-123-oauth-device-flow, fix/header-crash, release/v1.4.0
          PATTERN='^(feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|perf|test|ci|revert)\/[a-z0-9]+([._-][a-z0-9]+)*$'

          # Bots name their own branches and cannot be asked to stop. Dependabot
          # opens `dependabot/npm_and_yarn/<dep>-<version>`; without this the
          # convention check fails on every dependency PR forever, which trains
          # everyone to ignore a red check. Their *commit messages* are still
          # linted by the step above — that is the part that reaches main.
          if echo "$BRANCH" | grep -qE '^(dependabot|renovate)/'; then
            echo "✅ Branch name '$BRANCH' is bot-generated — convention not enforced."
            exit 0
          fi

          # The train (ADR 0023 D1, D3). A promotion pull request's head *is*
          # `beta/x.y.z`, which is a branch class the convention above does not
          # know about — without this every promotion fails a required check
          # and the train can never reach `main`. The shape is asserted rather
          # than waved through: `beta/` plus a bare `x.y.z`, which is what the
          # cut writes into every manifest.
          if echo "$BRANCH" | grep -qE '^beta/[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "✅ Branch name '$BRANCH' is a release train (ADR 0023 D1)."
            exit 0
          fi

          if echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "✅ Branch name '$BRANCH' is valid."
          else
            echo "❌ Branch name '$BRANCH' violates the convention."
            echo ""
            echo "Expected: <type>/<kebab-case-description>"
            echo "Types: feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|perf|test|ci|revert"
            echo "Examples: feat/proj-123-oauth-device-flow, fix/header-crash, release/v1.4.0"
            echo "Rules: lowercase only; words separated by hyphens; no consecutive/leading/trailing separators."
            exit 1
          fi

  # The branch model, enforced (ADR 0023 D1, D3, D19, D21, D26, D31).
  #
  # This job exists because **GitHub rulesets cannot restrict a pull request's
  # source branch** — there is no such setting, so "work reaches `main` only
  # through a train" is unenforceable as configuration and has to be a check.
  # Once it is in `main`'s required checks (#114) it is what makes D1 real.
  #
  # It runs on every pull request whatever the base, and says so in the log:
  # a base this model has nothing to say about passes with a notice rather
  # than a silent green, so "the check ran and found nothing to enforce" and
  # "the check did not run" are distinguishable from the outside.
  train-rules:
    name: Train rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      # `gh run list`, for D21 — the train's latest push.
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enforce the branch model
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          failed=0
          fail() {
            echo "::error title=$1::$2"
            failed=1
          }

          # D3, as amended by #152 and #157. The cut writes one version into
          # every manifest; this is what makes drift afterwards impossible
          # rather than discouraged. Hand-editing six files is how five of them
          # end up disagreeing, and the one that disagrees is found at
          # promotion, by a person.
          #
          # `packages/sdk` is the fifth (#152, ADR 0025) — it was four until the
          # core-link frames moved out of `packages/shared`. `packages/cli` is
          # the sixth (#157): the `actana` command's client half, and the second
          # package #129 publishes.
          #
          # The list below and the one in `promote.yml`'s cut are the same set
          # by construction, and the assertion under it is what keeps them that
          # way — read the count off `${#MANIFESTS[@]}`, never off this comment.
          MANIFESTS=(package.json packages/cli/package.json \
                     packages/core/package.json packages/panel/package.json \
                     packages/sdk/package.json packages/shared/package.json)

          # The failure mode this guards is not drift — it is a check that
          # quietly stops covering the repository. A manifest deleted or renamed
          # out from under the list, or another package added without extending
          # it, would leave this loop passing over a shrinking set and reporting
          # green, which is worse than no check at all because the promotion
          # checklist cites it by name. So the set is asserted before it is
          # read: every file exists, and every workspace package under
          # `packages/` is in the list. A new package fails here until it is
          # added, which is the ticket that should have added it anyway.
          assert_manifest_set() {
            local file candidate found intact=1
            for file in "${MANIFESTS[@]}"; do
              if [[ ! -f "$file" ]]; then
                intact=0
                fail "A manifest in the version set is missing" "$file is in this check's list and does not exist. Either the file moved and this list was not updated, or the package was deleted — the version assertion below would otherwise cover a smaller set than ADR 0023 D3 describes (amended by #152 and #157)."
              fi
            done
            for file in packages/*/package.json; do
              found=0
              for candidate in "${MANIFESTS[@]}"; do
                [[ "$candidate" == "$file" ]] && found=1
              done
              if [[ "$found" != "1" ]]; then
                intact=0
                fail "A workspace package is outside the version set" "$file is a workspace package and is not in this check's list, so nothing asserts it carries the train's version. Add it here and to \`promote.yml\`'s cut, and amend ADR 0023 D3 — that is what #152 did for \`packages/sdk\` and #157 for \`packages/cli\`."
              fi
            done
            # An `if`, not `[[ … ]] && echo`: the `&&` form makes the function
            # return non-zero when the set is broken, and under `set -e` a bare
            # call to it aborts the step before the `failed` accumulator at the
            # bottom is reached — so a set violation would report only itself
            # and leave every other rule in this step unevaluated. Every
            # violation here already went through `fail`, which is how this
            # step reports.
            if [[ "$intact" == "1" ]]; then
              echo "  ✅ the version set is ${#MANIFESTS[@]} manifests, and covers every workspace package"
            fi
          }

          assert_versions() {
            local expected="$1" file version
            assert_manifest_set
            for file in "${MANIFESTS[@]}"; do
              version="$(jq -r .version "$file")"
              if [[ "$version" != "$expected" ]]; then
                fail "Version drift in $file" "$file says $version; the train is $expected. Every manifest carries the train's version (ADR 0023 D3, amended by #152 and #157) — the cut wrote them and nothing else should be editing them."
              else
                echo "  ✅ $file is $version"
              fi
            done
          }

          # D21. When a train merge's image build fails, `beta-x.y.z` does not
          # move and the train is silently un-promotable. Left alone that
          # surfaces at the dispatch, after a human has already worked the
          # acceptance checklist against a stale image — so it surfaces here,
          # on the pull request that would promote it.
          assert_train_is_green() {
            local train="$1" run conclusion status url
            run="$(gh run list --repo "$REPO" --branch "$train" --workflow ci.yml \
                     --event push --limit 1 --json conclusion,status,url \
                     --jq '.[0] // empty')"
            if [[ -z "$run" ]]; then
              echo "::notice title=No train push to check::No push run on $train yet. A zero-merge train is legitimate — its image came from the cut."
              return
            fi
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            status="$(jq -r '.status // ""' <<<"$run")"
            url="$(jq -r '.url // ""' <<<"$run")"
            case "$conclusion" in
              success)
                echo "  ✅ the train's latest push is green" ;;
              "")
                echo "::notice title=The train is still building::$train's latest push is $status ($url). Promotion asserts the digest, so a run that has not finished is not a blocker here — but the image may still move." ;;
              *)
                fail "The train's latest publish is red" "$train's latest push run concluded '$conclusion' ($url). \`beta-$version\` did not move, so this pull request would promote bytes older than the train tip. Fix the train and let it republish before promoting (ADR 0023 D21)." ;;
            esac
          }

          echo "Base: $BASE"
          echo "Head: $HEAD"

          case "$BASE" in
            main)
              # D1. `main` accepts exactly one kind of change: a promotion of a
              # whole train. No exception for hotfixes (they are expedited
              # trains, D22), for documentation, or for reverts.
              if [[ "$HEAD" != beta/* ]]; then
                fail "Only a train may target main" "This pull request is based on \`main\` with head \`$HEAD\`. Work reaches \`main\` only by promoting a train (ADR 0023 D1) — retarget it at the open \`beta/x.y.z\` branch. A hotfix is an expedited train (D22), not an exception."
              else
                version="${HEAD#beta/}"
                if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  fail "Not a train branch" "\`$HEAD\` is not \`beta/x.y.z\`. The promotion's head is the train, and the train's name is its version (ADR 0023 D3)."
                else
                  echo "Promotion pull request for $version."
                  assert_versions "$version"
                  assert_train_is_green "$HEAD"
                fi
              fi
              ;;

            beta/*)
              version="${BASE#beta/}"
              if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                fail "Not a train branch" "\`$BASE\` is not \`beta/x.y.z\` (ADR 0023 D3)."
              else
                # "The open train" is not a list to keep in sync — it is a
                # property of the branch: a train promotes by fast-forward
                # (D5), so a train `main` is no longer an ancestor of can
                # never promote at all. That is exactly what a train stranded
                # by someone else's promotion looks like (D2), and it is
                # better found here than by the author of the pull request
                # sitting on it.
                #
                # The branch list below is *not* the rule and is not consulted
                # by it — it is printed so that "this train is dead" arrives
                # next to the names of the trains that are not, which is the
                # one thing the author of a stranded pull request needs. It
                # cannot fail the check for the same reason: a rule that does
                # not read it must not die when it is unavailable.
                trains="$(gh api "repos/$REPO/branches?per_page=100" --paginate \
                           --jq '.[].name | select(startswith("beta/"))' | sort || true)"
                echo "Open trains (context only — the rule is the compare below):"
                echo "${trains:-  (could not list branches)}" | sed 's/^/  /'
                status="$(gh api "repos/$REPO/compare/main...$BASE" --jq .status)"
                case "$status" in
                  ahead|identical)
                    echo "  ✅ $BASE can still fast-forward into main" ;;
                  *)
                    fail "This train is dead" "\`main\` is not an ancestor of \`$BASE\` (compare says '$status'), so it can never fast-forward and can never be promoted (ADR 0023 D2, D5). Another train was promoted past it. Retarget this pull request at the open train, or wait for the post-hotfix rebase (D24)." ;;
                esac

                # The head is an ordinary branch. A train targeting a train is
                # not a thing the model has, and the `beta/*` allowlist in
                # `Conventions` above would otherwise wave it through.
                PATTERN='^(feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|perf|test|ci|revert)\/[a-z0-9]+([._-][a-z0-9]+)*$'
                if echo "$HEAD" | grep -qE '^(dependabot|renovate)/'; then
                  echo "  ✅ $HEAD is bot-generated"
                elif ! echo "$HEAD" | grep -qE "$PATTERN"; then
                  fail "Head branch does not follow the convention" "\`$HEAD\` is not \`<type>/<kebab-case-description>\`. A train's own name (\`beta/x.y.z\`) is allowed only as the *head* of a promotion pull request into \`main\`."
                else
                  echo "  ✅ $HEAD follows the branch convention"
                fi

                assert_versions "$version"
              fi
              ;;

            release/*)
              # D26, D31. Backports are the one exception to digest promotion,
              # and the exception is bounded: the last two minor lines while
              # the product is past 1.0, the current line only before it —
              # a `0.x` minor bump *is* the breaking change under semver, so
              # backporting across one is backporting across a break.
              lines="$(gh api "repos/$REPO/branches?per_page=100" --paginate \
                        --jq '.[].name | select(startswith("release/"))' \
                        | sed 's|^release/||' | sort -t. -k1,1n -k2,2n -r)"
              if [[ -z "$lines" ]]; then
                fail "No release lines exist" "\`$BASE\` does not look like a supported line — this repository has no \`release/*\` branches at all."
              else
                if [[ "$(head -n1 <<<"$lines" | cut -d. -f1)" == "0" ]]; then
                  supported="$(head -n1 <<<"$lines")"
                  echo "Pre-1.0: the supported set is the current line only (ADR 0023 D31)."
                else
                  supported="$(head -n2 <<<"$lines")"
                fi
                echo "Supported lines:"; echo "$supported" | sed 's|^|  release/|'
                if ! grep -qxF "${BASE#release/}" <<<"$supported"; then
                  fail "That release line is not supported" "\`$BASE\` is not one of the supported lines. Anything older gets \"upgrade to latest\", which the one-command installer and the compose setup make cheap (ADR 0023 D26, D31)."
                else
                  echo "  ✅ $BASE is a supported line"
                fi
              fi
              ;;

            *)
              echo "::notice title=No train rules apply::This pull request is based on \`$BASE\`, which is neither \`main\`, a train, nor a release line. Nothing in the branch model constrains it."
              ;;
          esac

          if [[ "$failed" != "0" ]]; then
            echo "❌ The branch model rejects this pull request. See the annotations above."
            exit 1
          fi
          echo "✅ Branch model satisfied."

  # The merge button on a promotion gate, made fatal (#264, ADR 0023 D5, D16).
  #
  # A `beta/x.y.z → main` pull request is a gate: checks and an approval
  # accumulate on it and `promote.yml` performs the advance. GitHub offers a
  # merge button on it anyway, and the repository's only enabled merge method
  # is `squash` — the one that rewrites the SHA. #259 was squash-merged on
  # 2026-08-18, the tested SHA stopped existing, the D16 digest assertion
  # became unsatisfiable, and `v0.3.1` was abandoned with nothing red anywhere.
  #
  # Four documents and `promote.yml:191-193` already said the button must not
  # be pressed; the person who pressed it had read one of them seven minutes
  # earlier. This job is the difference between a rule and a mechanism: it goes
  # red on exactly that pull request, permanently, and red is the healthy
  # state for a gate. Its context is required by `docs/rulesets/main.json`,
  # which is what turns the red into a disabled button.
  #
  # It does not break promotion, and this is the part worth being sure of:
  # `promote.yml` never reads the gate pull request's check state. It asserts
  # the pull request exists and is unique (`promote.yml:196-207`), reads its
  # `headRefOid`, re-checks ancestry (`:444`) and pushes the SHA (`:457`) as
  # the App, which is a bypass actor on 20390421 — so required checks do not
  # apply to that push. A permanently red gate is invisible to the promotion
  # path.
  #
  # **No `if:` on this job, deliberately** (ADR 0023 D33). A required check
  # whose job is skipped stays Pending forever and blocks the pull request
  # permanently, including the pull request that would remove the requirement.
  # `Conventions` and `Train rules` carry `if: github.event_name ==
  # 'pull_request'` and are safe because a push has no pull request to block —
  # but this is the check that exists *because* a gate was waved through, so it
  # takes the stricter form rather than the merely-sufficient one: every
  # not-applicable case is an early `exit 0` inside the script, on every event.
  #
  # The decision is `scripts/promotion-gate.sh` rather than an inline heredoc so
  # that both of its branches are executed by
  # `scripts/__tests__/promotion-gate.test.mjs`, against the real script, rather
  # than asserted by grepping this file.
  promotion-gate:
    name: Promotion gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Refuse a hand merge of the promotion gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/promotion-gate.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # `--prod` (ADR 0016 D37): the gate is about what ships. It still catches
  # `postcss` and `@babel/core`, which reach the runtime image through the
  # Panel's *production* graph, and it drops the dev-only `brace-expansion`
  # highs that no contributor caused and none can fix. A check that is red for
  # reasons unrelated to the change in front of it is a check everyone learns
  # to click past. The dev tree is not unwatched — it gets a weekly audit that
  # opens an issue instead of gating a PR (housekeeping.yml).
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm scan:secrets

  # The Panel service seam (web-panel-extraction issue 10) — the spec's primary
  # testing seam. Boots the built Panel as a plain node process against a temp
  # data directory plus a real Core, then drives it exactly as a browser
  # would: setup → login → paste a pairing token → panel link → PTY frames →
  # killed link → replay from cursor, with the pre-login refusals and the
  # secrets-at-rest legs alongside. One command covers auth, the registry,
  # secrets, the router, and a live core-link.
  #
  # Ubuntu only (ADR 0016 D35). This ran on macOS too, at 10× the billing, for
  # a way the Panel ships nowhere: the deployable is a container. The natives
  # that leg existed to exercise — node-pty and better-sqlite3 — are built and
  # booted on the platform that ships by `panel-image` below.
  #
  # The Core runs as a local process here (scripts/lib/core-fixture.mjs);
  # pairing against a *containerised* Core is the `core-image` job.
  panel-e2e:
    name: E2E — Panel service seam
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: true

      # node-gyp 9.x imports distutils; pin 3.11.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `panel:e2e` builds both artifacts and then drives them, so the test
      # always runs against freshly built code rather than a stale dist.
      - name: E2E — the Panel service, driven as a browser
        run: pnpm panel:e2e

  # The release-tarball seam (core-installer issue 01): the artifact
  # operators actually download must extract and boot on its own — bundled Node,
  # bundled natives, no system Node, no network. Built here on every PR for the
  # runner's own platform so a broken tarball is caught before release time;
  # release.yml builds and smokes both released targets when a release runs —
  # called from the promotion or dispatched by hand, never on a tag push
  # (ADR 0023 D40).
  #
  # This is now the only boot-and-dial smoke on a PR. There was a second —
  # `smoke-standalone-core.mjs`, against the unpacked bundle — but it made the
  # same `assertBootsAndDials` assertion this one does, one layer further from
  # anything that ships, and nothing ships the path it uniquely covered
  # (ADR 0016 D35).
  #
  # Both Linux architectures, because everything downstream consumes these
  # artifacts (core-installer issue 07): the installer matrix downloads them
  # rather than rebuilding per leg, so one build per architecture feeds every
  # e2e job that needs it. arm64 builds natively on
  # an arm runner — the tarball carries prebuilt natives, and a cross-built one
  # would prove nothing about what operators download.
  core-tarball-smoke:
    name: Smoke — Core release tarball (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the tarball
        run: pnpm core:tarball

      - name: Smoke — extracted tarball boots a dialable Core
        run: |
          set -euo pipefail
          tarball="$(find artifacts/core -name 'actana-core-*-${{ matrix.target }}.tar.gz' | head -n1)"
          node scripts/smoke-core-tarball.mjs --tarball "$tarball"

      # The checksum asset is generated code too — a formatting slip only shows
      # up as an operator's failed `sha256sum -c`, so verify it here.
      - name: Compose and verify SHA256SUMS
        run: |
          set -euo pipefail
          node scripts/compose-core-shasums.mjs --dir artifacts/core --expect 1
          cd artifacts/core && sha256sum -c SHA256SUMS

      - name: Upload the tarball for the installer e2es
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-tarball-${{ matrix.target }}
          path: artifacts/core/actana-core-*-${{ matrix.target }}.tar.gz
          retention-days: 1

  # The installer matrix (core-installer issue 07, ADR 0016 D36) — the whole
  # Linux install story in one script, crossed over the axes that can actually
  # break it.
  #
  # One suite, not two: the `curl … | bash` one-liner is the *entry point* of
  # `e2e-actana-setup-linux.mjs` rather than a job of its own, so the lifecycle
  # verbs, update, token regenerate and uninstall all run on the machine the
  # one-liner produced. Strictly more coverage at roughly the cost of one, and
  # one fewer container boot per leg. install-sh's negative cases beyond the two
  # the container leg makes are covered hermetically, in under a second, by
  # scripts/__tests__/install-sh.test.mjs.
  #
  #   distro — Ubuntu and Debian. What differs between them is precisely what
  #            this test is about: PAM, polkit and the logind rules that decide
  #            whether a sudo-less `systemctl --user` and `loginctl
  #            enable-linger` work at all.
  #   arch   — x64 here, arm64 on the tag run (release.yml). The
  #            arch-sensitive risk is prebuilt native modules, and
  #            `core-tarball-smoke` above already boots the arm64 tarball on an
  #            arm64 runner on every PR.
  #
  # Two legs, both parallel, each downloading a tarball built once above rather
  # than building its own — so the matrix costs one container boot of wall
  # clock, not two builds. `fail-fast: false` because "Debian only" is exactly
  # the signal this job exists to produce.
  #
  # ADR 0016 D36 cuts this to two legs — one merged suite, ubuntu and debian at
  # x64, with arm64 moving to the tag run — but that is a change to the e2e
  # scripts themselves and belongs to the ticket that makes it (#48), not here.
  #
  # The axes are declared in scripts/lib/container-matrix.mjs, and
  # scripts/__tests__/container-matrix.test.mjs reads this file to check the two
  # still agree — a distro added there and forgotten here fails the unit tests.
  installer-e2e:
    name: E2E — installer (${{ matrix.distro }}, ${{ matrix.arch }})
    needs: core-tarball-smoke
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian]
        arch: [x64]
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: true

      # Only `ws` is needed — the e2es' core-link dial is the sole dependency
      # they have on the repo's own node_modules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: core-tarball-${{ matrix.target }}
          path: artifacts/core

      - name: E2E — the one-liner and the lifecycle on a fresh systemd machine
        run: |
          set -euo pipefail
          tarball="$(find artifacts/core -name 'actana-core-*-${{ matrix.target }}.tar.gz' | head -n1)"
          node scripts/e2e-actana-setup-linux.mjs --tarball "$tarball" --distro ${{ matrix.distro }}

  # There is no macOS counterpart to the jobs above, and `mac-arm64` being a
  # release target again (ADR 0016 D28, as amended) does not change that. D35
  # took the macOS legs off the PR gate because they were 72% of the bill at
  # 10× billing, and that is the decision this file keeps: zero macOS minutes
  # on a pull request. The one mac leg lives in release.yml and now builds
  # alongside the Linux legs — the human approval moved out of it to the head of
  # `promote.yml` (ADR 0023 D15, landing in #111), which is upstream of the
  # whole release; `e2e-actana-setup-macos.mjs` stays deleted, and
  # docs/core-macos-prerelease-checklist.md is what a person runs instead.
  # `scripts/__tests__/workflows.test.mjs` fails if a macOS runner appears in
  # this file.

  # ------------------------------------------------------ pull request images
  #
  # Every push to a non-draft pull request publishes an image a reviewer can
  # run, rather than read (ADR 0023 D32). One check name covers four
  # behaviours, and each run says which one it took (D38):
  #
  #   build + push   same-repo, non-draft, code-touching  → pr-<prid><YYYYMM>
  #   build, no push fork                                 → today's behaviour (D34)
  #   verify         promotion PR (base main, head beta/*) → assert the digest (D19)
  #   pass           draft, or a documentation-only diff  → green immediately (D33)
  #
  # They are four modes of one job rather than four jobs because the ruleset
  # pins these check names, and **a required check whose job is skipped stays
  # Pending forever** — the failure that forced `landing.yml` into a file of
  # its own. ADR 0016's principle here — *a job that sometimes pushes is a job
  # whose green means two different things* — is narrowed by D38 rather than
  # discarded: it guards against a green check concealing a publish, and every
  # mode below asserts "these bytes are good" while the modes are mutually
  # exclusive on observable facts rather than on a flag someone sets.
  #
  # Deciding the mode is a job of its own because a `uses:` job cannot run a
  # step to work out its own inputs — which puts a job of ours directly
  # upstream of two required checks, and a `needs:` whose upstream *failed* is
  # reported as **skipped**. That is the same trap again, reached by a new
  # route: this job failing for any reason at all would leave `Panel image` and
  # `Core image` Pending forever.
  #
  # So the resolve is two steps, split on exactly that line. The first thinks
  # and is allowed to fail; the second thinks about nothing and therefore
  # cannot. `continue-on-error` on both keeps a step's failure off the job's
  # conclusion, the thinking step writes a file rather than `$GITHUB_OUTPUT`,
  # and the deciding step supplies a default for anything the file is missing.
  # A resolver that dies for *any* reason — an unreadable file list, a runner
  # hiccup, a future edit with a typo in it — therefore yields `mode=build`
  # with `push=false`, and both image checks still run and still report. A
  # build nobody needed costs one runner; a required check that can never
  # leave Pending costs the repository.
  pr-image-mode:
    name: Resolve PR image mode
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      push: ${{ steps.mode.outputs.push }}
      stage: ${{ steps.mode.outputs.stage }}
      ref: ${{ steps.mode.outputs.ref }}
      tags: ${{ steps.mode.outputs.tags }}
      dev_tags: ${{ steps.mode.outputs.dev_tags }}
    steps:
      # The failure boundary. Everything that can fail is on this side of it:
      # the API call, the pattern matching, the `date`, the write.
      - name: Work out the mode
        id: resolve
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          MERGE_SHA: ${{ github.sha }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          RESOLVED: ${{ runner.temp }}/pr-image-mode.env
        run: |
          set -euo pipefail

          # The documentation-only test that used to be the `push` trigger's
          # `paths-ignore` (D20 took it off the train path, not this one). A
          # diff that ships no code into either image has nothing to prove by
          # building one, and the saving is nearly all of it: pull request
          # pushes vastly outnumber train merges.
          #
          # An unreadable file list resolves to "not documentation-only", which
          # costs a build nobody needed. The other way round costs a merged
          # change whose image was never built.
          #
          # A *partial* list reaches that unsafe answer by a different route:
          # `pulls/:number/files` truncates past 300 entries however hard
          # `--paginate` asks, so a large diff can return its documentation
          # files with the code files missing and read as documentation-only.
          # The PR payload's own `changed_files` is the count that does not
          # truncate, so a short list is treated as no list at all.
          docs_only=false
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' || true)"
          listed="$(grep -c . <<<"$files" || true)"
          if [[ -n "$files" && "$listed" -lt "${CHANGED_FILES:-0}" ]]; then
            echo "::notice title=File list truncated::The API returned $listed of $CHANGED_FILES changed files, so the documentation-only test cannot be trusted and this build runs. GitHub truncates this endpoint past 300 files."
            files=""
          fi
          if [[ -n "$files" ]] && ! grep -qvE '(\.md$|^docs/|^\.scratch/|^designs/|^landing/)' <<<"$files"; then
            docs_only=true
          fi

          mode=build
          push=false
          tags=""
          dev_tags=""
          ref="$MERGE_SHA"
          # `pr-<number>`, never `ci` (ADR 0023 D12). `container-image.yml`
          # pushes per-arch `<stage>-<arch>` tags *before* stitching the
          # manifest; two open pull requests sharing `stage: ci` would
          # overwrite each other's, and the stitch could then assemble a
          # manifest from another pull request's bytes. Harmless while PR
          # builds pushed nothing; corrupting from the moment they do.
          stage="pr-$PR"

          if [[ "$DRAFT" == "true" ]]; then
            mode=pass
            why="the pull request is a draft"
          elif [[ "$BASE" == "main" && "$HEAD" == beta/* ]]; then
            # D19. The image this would build already exists — the train built
            # it — so the hour is spent proving it is the right one instead.
            mode=verify
            ref="$HEAD_SHA"
            tags="beta-${HEAD#beta/}"
            why="this is the promotion pull request for ${HEAD#beta/}"
          elif [[ "$docs_only" == "true" ]]; then
            mode=pass
            why="the diff touches documentation only"
          elif [[ "$HEAD_REPO" != "$REPO" ]]; then
            # D34. GitHub does not expose secrets to a `pull_request` run from
            # a fork, by design, and `pull_request_target` is rejected
            # outright: the credential it would hand contributor-authored code
            # can push `:latest`. The pull request image is therefore a
            # maintainer convenience, not a contributor one.
            mode=build
            why="the head is the fork $HEAD_REPO, which has no registry credential"
          else
            mode=build
            push=true
            # `pr-<prid><YYYYMM>` (D10): mutable on purpose — what it points at
            # is what is under discussion — and not `sha-`, which this
            # repository already uses for the opposite thing. The six-digit
            # suffix is fixed width so the PR id is recoverable from the right.
            dev_tags="pr-${PR}$(date -u +%Y%m)"
            why="a same-repo pull request touching code"
          fi

          echo "mode=$mode ($why)"
          # One shot, at the end, into a file rather than `$GITHUB_OUTPUT`: a
          # resolve that dies partway through must leave *nothing* behind
          # rather than half a decision, and a later default appended to
          # `$GITHUB_OUTPUT` would silently win over a good value already
          # written there. The next step is the only writer of the outputs.
          {
            echo "mode=$mode"
            echo "push=$push"
            echo "stage=$stage"
            echo "ref=$ref"
            echo "tags=$tags"
            echo "dev_tags=$dev_tags"
            echo "why=$why"
          } >"$RESOLVED"

      # The other side of the boundary. No network, no `gh`, no `set -e`, and
      # nothing to decide that was not already decided: it reads the resolver's
      # answer out of a local file, defaults what is missing, writes the
      # outputs.
      # `continue-on-error` here too — not because this step is expected to
      # fail, but because "the job cannot fail" has to hold for the whole job
      # or it does not hold at all. If it somehow does fail, the outputs it
      # managed to write stand and the image jobs run with an empty mode, which
      # `container-image.yml` rejects loudly: a red required check is
      # re-runnable, a Pending one is not.
      - name: Decide
        id: mode
        continue-on-error: true
        env:
          RESOLVED: ${{ runner.temp }}/pr-image-mode.env
          PR: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          value() { sed -n "s/^$1=//p" "${RESOLVED:-/nonexistent}" 2>/dev/null | tail -n 1; }

          mode="$(value mode)"
          push="$(value push)"
          stage="$(value stage)"
          ref="$(value ref)"
          tags="$(value tags)"
          dev_tags="$(value dev_tags)"
          why="$(value why)"

          # `build` is what a resolve that did not finish produces, and
          # `push=false` goes with it. Never `verify` or `pass`: both report a
          # green check having built nothing, and a crash must not be able to
          # reach an answer that proves nothing. A publishing fallback would be
          # worse still — bytes under a tag chosen by a decision that did not
          # finish.
          #
          # A *partial* file is rejected whole rather than read for the parts
          # that made it: `why` is written last, so its absence is the
          # resolver saying it did not finish, and `mode=verify` with the tag
          # it was going to verify missing is worse than no answer at all.
          case "$mode" in
            build|verify|pass) ;;
            *) mode="" ;;
          esac
          if [[ -z "$mode" || -z "$why" ]]; then
            echo "::warning title=PR image mode fell back to build::The resolver did not finish, so the mode defaulted to a build that publishes nothing. Both image checks still run and still report — a skipped required check would stay Pending forever (ADR 0023 D33). The 'Work out the mode' step above says what went wrong."
            mode=build
            push=false
            tags=""
            dev_tags=""
            why="the resolver did not finish"
          fi
          [[ "$push" == "true" ]] || push=false
          [[ -n "$stage" ]] || stage="pr-${PR:-0}"
          [[ -n "$ref" ]] || ref="$MERGE_SHA"

          echo "mode=$mode push=$push stage=$stage ref=$ref (${why:-no reason recorded})"
          {
            echo "mode=$mode"
            echo "push=$push"
            echo "stage=$stage"
            echo "ref=$ref"
            echo "tags=$tags"
            echo "dev_tags=$dev_tags"
          } >> "$GITHUB_OUTPUT"

  # The Panel image, built and smoked on every code-touching pull request.
  # Until this existed, a Dockerfile or build-stage break stayed invisible
  # until someone cut a release tag and the release itself failed. Same
  # reusable workflow the train and the release use, so this is the release
  # build, not an approximation of it.
  #
  # amd64 only (D35): the train and release builds cover arm64 natively, and
  # paying for a second runner on every PR buys little — the two legs share a
  # Dockerfile, and arch-specific breakage is almost always in better-sqlite3's
  # native build, which this leg already exercises. Emulation on Apple silicon
  # is acceptable for a developer poking at a change; it is not acceptable for
  # anything an operator deploys.
  #
  # `push_required: false` (D37): the publish goes to `panel-dev`, and the gate
  # is the build and the smoke. A Docker Hub outage must not freeze merging.
  panel-image:
    name: Panel image
    if: github.event_name == 'pull_request'
    needs: pr-image-mode
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      image: panel
      ref: ${{ needs.pr-image-mode.outputs.ref }}
      stage: ${{ needs.pr-image-mode.outputs.stage }}
      mode: ${{ needs.pr-image-mode.outputs.mode }}
      tags: ${{ needs.pr-image-mode.outputs.tags }}
      dev_tags: ${{ needs.pr-image-mode.outputs.dev_tags }}
      push: ${{ needs.pr-image-mode.outputs.push == 'true' }}
      push_required: false
      matrix: '{"include":[{"os":"ubuntu-24.04","arch":"amd64"}]}'

  # Same reasoning, and this job carries more than a build: the Core image's
  # boot-and-pair smoke and the Trivy gate both run inside it (ADR 0016 D36),
  # so a break in core.Dockerfile surfaces on the PR that caused it rather
  # than on the next release. It is what `panel-e2e-core-in-a-box` used to be,
  # against the bytes that ship and with nothing privileged.
  #
  # The CVE gate blocks the merge (ADR 0016 D11), and nothing CVE-flagged
  # reaches a release repository — this path publishes to `panel-dev` /
  # `core-dev` only.
  #
  # D37 asks for one thing this does not do: it wants the `-dev` publish to
  # happen *even when the scan fails*, on the grounds that the image you most
  # need to pull and inspect is the one that failed. `container-image.yml`
  # pushes only on `if: inputs.push`, which a failed earlier step suppresses,
  # and `publish` needs a green `build` — so a CVE-flagged image is built,
  # scanned, reported, and not published. Making it publish means unpicking
  # the invariant `scripts/__tests__/image-cve-gate.test.mjs` pins for the
  # release path ("an image that fails the gate never reaches a registry")
  # in two places, and that is a decision to take deliberately rather than as
  # a side effect of this ticket. The scan JSON is uploaded either way.
  core-image:
    name: Core image
    if: github.event_name == 'pull_request'
    needs: pr-image-mode
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      image: core
      ref: ${{ needs.pr-image-mode.outputs.ref }}
      stage: ${{ needs.pr-image-mode.outputs.stage }}
      mode: ${{ needs.pr-image-mode.outputs.mode }}
      tags: ${{ needs.pr-image-mode.outputs.tags }}
      dev_tags: ${{ needs.pr-image-mode.outputs.dev_tags }}
      push: ${{ needs.pr-image-mode.outputs.push == 'true' }}
      push_required: false
      matrix: '{"include":[{"os":"ubuntu-24.04","arch":"amd64"}]}'

  # ------------------------------------------------------------ the train
  #
  # Every merge into `beta/x.y.z` publishes the image a person will pull, run
  # and approve — and promotion re-points that exact digest at `x.y.z` and
  # `latest` (ADR 0023 D7, D16). Nothing is rebuilt between the thing that was
  # approved and the thing that ships:
  #
  #   beta-x.y.z    panel / core,          multi-arch, moves per merge
  #   sha-<short>   panel-dev / core-dev,  multi-arch, never moves
  #
  # These sit structurally where `panel-image-edge` / `core-image-edge` sat —
  # same reusable workflow, same build, same smoke, new tags — which keeps ADR
  # 0016's one-build-implementation property intact and makes this a
  # substitution rather than a rewrite. `:edge` is retired, job and tag (D13):
  # it published from `main`, and under the train model `main` is only ever a
  # released version, so `:edge` would be a second name for `:latest`.
  #
  # Nothing here moves `:latest` — that stays the property of a promotion, and
  # a promotion publishes no bytes at all.
  #
  # One build, two repositories. `sha-<short>` is the immutable handle on
  # exactly the digest `beta-x.y.z` names (D11) — it answers "which commit
  # introduced this", which is the question a misbehaving beta produces — and
  # it lives in `-dev` because the sweep that deletes it needs a delete-capable
  # credential, which D36 keeps permanently out of the repositories holding
  # `latest`. Building it a second time would answer that question with a
  # different digest.
  #
  # `startsWith(github.ref, 'refs/heads/beta/')` rather than `!= 'pull_request'`,
  # so a `workflow_dispatch` republishes a train — the images-edge.yml
  # affordance, kept — while a dispatch on any other branch runs the gates and
  # publishes nothing.
  train-tags:
    name: Resolve train tags
    if: startsWith(github.ref, 'refs/heads/beta/')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tags.outputs.version }}
      tags: ${{ steps.tags.outputs.tags }}
      dev_tags: ${{ steps.tags.outputs.dev_tags }}
      stage: ${{ steps.tags.outputs.stage }}
    steps:
      - id: tags
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${BRANCH#beta/}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Not a train branch::'$BRANCH' is not beta/x.y.z, so there is no version to publish under. A train's name is its version (ADR 0023 D3)."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tags=beta-$version"
            echo "dev_tags=sha-${SHA:0:7}"
            # Per train, not a bare `beta`: two trains exist while a hotfix is
            # in flight (D22), and a shared stage would let them overwrite each
            # other's per-arch tags (D12).
            echo "stage=beta-$version"
          } >> "$GITHUB_OUTPUT"

  panel-image-train:
    name: Panel image (train)
    if: startsWith(github.ref, 'refs/heads/beta/')
    needs: train-tags
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      image: panel
      ref: ${{ github.sha }}
      stage: ${{ needs.train-tags.outputs.stage }}
      tags: ${{ needs.train-tags.outputs.tags }}
      dev_tags: ${{ needs.train-tags.outputs.dev_tags }}
      push: true

  core-image-train:
    name: Core image (train)
    if: startsWith(github.ref, 'refs/heads/beta/')
    needs: train-tags
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      image: core
      ref: ${{ github.sha }}
      stage: ${{ needs.train-tags.outputs.stage }}
      tags: ${{ needs.train-tags.outputs.tags }}
      dev_tags: ${{ needs.train-tags.outputs.dev_tags }}
      push: true
