name: Release

# Everything a release publishes: the three Core tarballs and their
# SHA256SUMS, the Panel and Core images, the npm packages, and the GitHub
# Release. One file rather than five, because they are one event (ADR 0016
# D34).
#
#   resolve ─┬─ tarball ──────── installer-e2e ─┐
#            │                                  │
#            └─ tarball-macos ─┬─ panel ────────┼── npm ── github-release
#                              └─ core ─────────┘
#
# `panel` and `core` go through the reusable container-image.yml with
# push: true; `npm` waits on all of them and on both tarball legs, because it
# is the only publish here that cannot be repeated (#129 D13 — see its own
# header); and `github-release` is last, because it is the announcement.
#
# The Docker Hub pages are **not** here. `descriptions` moved to
# housekeeping.yml and now covers all four repositories on a weekly tick (ADR
# 0023 D43). ADR 0016 D33's reason for gating it on the two image publishes —
# a page must not describe a version nobody can pull — did not move with it and
# is not restated there: the `-dev` pages have nothing to do with a release,
# and four pages that drift until someone happens to cut a release is the
# larger problem.
#
# ── Two modes (ADR 0023 D17, D26) ────────────────────────────────────────────
#
# `resolve` picks one from where the tag lives, and says which in the log:
#
#   promote   the tag is reachable from `main`. `panel` and `core` re-point the
#             verified `beta-x.y.z` digest at `<version>` (and `latest`) with
#             `docker buildx imagetools create`, and **build nothing**. A
#             promotion cannot produce different bytes because it produces no
#             bytes — which is this ADR's central claim, and it reduces to the
#             assertion that the digest's `org.opencontainers.image.revision`
#             label equals the promoted commit before anything is retagged.
#
#   backport  the tag is on a `release/*` branch. No beta train exists for an
#             old line, so there is no digest to promote and the images are
#             built and pushed from that branch. It is the one documented
#             exception in the design (D26), and it keeps every gate the build
#             path has — the smoke, and the Trivy CVE gate that stands between
#             a flagged image and a repository people deploy from.
#
# Both modes go through the same reusable workflow under the same two job
# names. `Panel image` / `Core image` are also the names of ci.yml's pinned
# required checks; the events differ so there is no clash, but a rename here
# would be a rename of a pinned check name and neither moves.
#
# ── The human pause is no longer here (ADR 0023 D15) ─────────────────────────
#
# `tarball-macos` used to declare `environment: macos-release`, so that every
# publishing job sat downstream of a person. That ordering is preserved and
# strengthened rather than dropped: the pause moved to the head of
# `promote.yml`, which is upstream of this entire workflow — so the
# fast-forward onto `main` is downstream of the human too, and `main` never
# contains unapproved code. Exactly one pause exists; two would be a worse
# experience for no extra safety.
#
# The image jobs still wait on `tarball-macos`, now for a different reason: not
# a gate on a person, but a gate on the release being whole. An image and its
# `:latest` published beside a GitHub Release that is missing a third of its
# tarballs is the failure this ordering still prevents.
#
# Exactly four assets (D28, as amended): actana-core-<version>-linux-x64.tar.gz,
# actana-core-<version>-linux-arm64.tar.gz,
# actana-core-<version>-mac-arm64.tar.gz, SHA256SUMS. No signing, no
# notarization, and no secrets beyond `github.token` for the assets and the
# Docker Hub PAT for the mirror. Integrity is the published checksums, verified
# by `install.sh` and by `actana update`.
#
# ── The installer contract (ADR 0016 D29), quoted verbatim ───────────────────
#
# > `install.sh` on `main` must work against **every published release**. Its
# > contract with a release is three things: the `SHA256SUMS` asset name, the
# > `actana-core-<version>-<target>.tar.gz` asset name, and `bin/actana` inside
# > the extracted directory. Changing any of them is a breaking change to the
# > installer contract requiring a major bump plus a documented migration — not
# > a patch-level edit to a shell script.
#
# `install.sh` itself is deliberately **not** an asset: it stays on
# raw.githubusercontent.com/actana/control/main/install.sh, so a broken
# installer is fixable without cutting a release.
#
# ── The registry posture ─────────────────────────────────────────────────────
#
# Docker Hub is the only registry the **images** go to (ADR 0018 — GHCR was
# retired), and since #159 that ADR is amended: npm is a second registry, for
# the two published packages. A *missing* credential for either is decided here
# in `resolve` before anything is built — fatal, on any repo, because there is
# no registry left that authenticates for free. A present-but-*broken*
# credential fails later and in its own place: at the `docker login` in
# container-image.yml before any tag is pushed, and at `npm publish` in the
# `npm` job below, after everything else has already succeeded.
#
# The asymmetry between the two registries is worth stating once, because the
# rest of this file is built on the half that is no longer universally true: a
# container tag is a pointer and can be re-pointed, which is what promote mode
# *is*. An npm version is not a pointer. It is consumed on first publish and
# never returns.

# ── The trigger (ADR 0023 D40, as amended by #326) ───────────────────────────
#
# **A dispatch, and nothing else.** Two triggers are absent and each absence is
# load-bearing.
#
# `workflow_call` is gone, and that is the fix for #326. A local
# `uses: ./.github/workflows/release.yml` resolves this file from the
# **caller's** SHA, and for a `workflow_dispatch` promotion that SHA is the
# default branch as it stood when the run was created — never the train being
# promoted. Run 32716466300 published nothing because of it: the 0.4.0 train
# had already fixed the tarball legs in this file, and the promotion ran the
# copy from before the fix, so all three legs died on a bundle the train built
# and `main` did not. Without the trigger there is no `uses:` that can do that,
# so the mismatch is not detected — it is unreachable.
#
# `promote.yml` now **dispatches** this workflow at `vx.y.z`, the tag it pushed
# a moment earlier at the promoted commit. A dispatch resolves every workflow
# file from the ref it is handed, this one and the `container-image.yml` it
# calls alike, so the release runs the promoted commit's own workflows by
# construction. The run's `head_sha` records which commit that was, and
# `promote.yml` asserts it equals the commit being promoted — the same field
# #326's evidence was read out of.
#
# `push: tags: v*` is gone too, and that absence is older. A tag push beside
# the dispatch would fire **two release runs** for one promotion, and they
# would not even block each other: `github.ref_name` differs between them, so
# the two would take different concurrency keys and race to build the same
# tarballs and create the same GitHub Release. It also removes the need for a
# guard rather than adding one — a stray hand-pushed `v*` tag does nothing at
# all, which is a stronger property than a check that catches it.
on:
  # Three ways in, one trigger. `promote.yml` dispatches this at the version
  # tag it has just pushed (D15, D40, #326); a person dispatches it to re-run a
  # release whose publish stopped — see docs/ci-cd.md § "When a promotion
  # half-runs" — and it is the only way a backport releases at all (D26) or its
  # release candidate goes out (D30).
  #
  # **Dispatch it at the tag**, not at the default branch: `gh workflow run
  # release.yml --ref vx.y.z -f tag=vx.y.z`. Both halves matter and they are
  # not the same thing — `--ref` decides which copy of this file runs, and
  # `-f tag` decides what it releases. `resolve` requires the tag to exist on
  # origin either way; every job downstream checks it out.
  #
  # A Docker Hub description typo is no longer fixed from here — merge the fix
  # and the weekly `descriptions` chore publishes it, or `gh workflow run
  # housekeeping.yml -f chore=descriptions` does it now (D43).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)release (e.g. v0.1.0). Must already exist on origin."
        required: true
        type: string

concurrency:
  # Derived from the version, never from `github.ref_name` (D40). That
  # expression is the tag when a promotion dispatches this at `vx.y.z` and the
  # default branch when a person dispatches it from the Actions tab, so two
  # invocations for one version would take two different keys and run at the
  # same time — which is exactly the race the dropped tag trigger would have
  # caused. `inputs.tag` is the same string however this run was created, and
  # `resolve` rejects anything that is not `vx.y.z`, so it *is* the version.
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    name: Resolve ref
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      version: ${{ steps.ref.outputs.version }}
      sha: ${{ steps.ref.outputs.sha }}
      mode: ${{ steps.ref.outputs.mode }}
      image_mode: ${{ steps.ref.outputs.image_mode }}
      source_tag: ${{ steps.ref.outputs.source_tag }}
      tags: ${{ steps.tags.outputs.tags }}
      latest: ${{ steps.tags.outputs.latest }}
      prerelease: ${{ steps.tags.outputs.prerelease }}
      npm_tag: ${{ steps.tags.outputs.npm_tag }}
    steps:
      # Every branch and every tag. Both questions this job answers are
      # questions about the whole ref graph rather than about one commit:
      # which mode this is, is "where does this tag live" (D26), and whether
      # `latest` moves is "is this the highest released version" (D28).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      # The checkout brings the refs that existed when this job started, and
      # `promote.yml` pushes the tag immediately before dispatching this
      # workflow at it. A second fetch costs a moment and removes a race that
      # would otherwise read as "no such tag" on a perfectly good promotion.
      - name: Fetch every branch and tag
        run: git fetch --force --prune --tags origin "+refs/heads/*:refs/remotes/origin/*"

      - id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ref="$INPUT_TAG"
          # All three components, and no `+build` metadata. `v0` and `v0.1`
          # would publish exactly the moving `:0` / `:0.1` tags D30 forbids,
          # and `+` is not a legal character in a Docker tag — nor would
          # `v0.1.0+abc` read as a prerelease, so it would move :latest.
          if [[ ! "$ref" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Not a version tag::'$ref' is not a version tag like v0.1.0 or v1.0.0-rc.1 — all three components, no +build metadata."
            exit 1
          fi
          version="${ref#v}"

          # The tag is the record a release leaves behind (D40), and every job
          # downstream checks it out. Deciding its absence here means one
          # actionable error rather than four checkout failures at once.
          if ! sha="$(git rev-parse -q --verify "refs/tags/$ref^{commit}")"; then
            echo "::error title=No such tag::$ref is not on origin. A release publishes an existing tag — promotion pushes it as a record before dispatching this workflow at it (ADR 0023 D40, as amended by #326), and a hand-driven dispatch needs it pushed first."
            exit 1
          fi

          # The mode, read off the branch graph and nothing else (D26). Not an
          # input and not a label: "this is a backport" is a fact about where
          # the tag lives, and a human-set flag would be the thing forgotten
          # during the incident that produced the backport.
          if git merge-base --is-ancestor "$sha" origin/main; then
            mode=promote
            image_mode=promote
            source_tag="beta-$version"
            echo "::notice title=Promote mode::$ref ($sha) is reachable from main, so the train published $source_tag and a human approved that digest. The image jobs retag it and build nothing (ADR 0023 D17); the retag is refused unless the digest's revision label is $sha (D16)."
          else
            lines="$(git branch --remotes --contains "$sha" --list 'origin/release/*' | sed 's/^[* ]*//' | tr '\n' ' ')"
            if [[ -z "${lines// }" ]]; then
              echo "::error title=Tag is on neither main nor a release line::$ref ($sha) is not reachable from main and is on no origin/release/* branch, so there is neither a beta digest to promote nor a release line to build from. A release tag lives in exactly one of those two places (ADR 0023 D26)."
              exit 1
            fi
            mode=backport
            image_mode=build
            source_tag=""
            echo "::notice title=Backport mode::$ref ($sha) is on ${lines% } and is not reachable from main, so no beta train ever published a digest for it. The images are built and pushed from the release line — the one documented exception to digest promotion (ADR 0023 D26). Every gate the build path has applies unchanged, the Trivy CVE gate included."
          fi

          {
            echo "ref=$ref"
            echo "version=$version"
            echo "sha=$sha"
            echo "mode=$mode"
            echo "image_mode=$image_mode"
            echo "source_tag=$source_tag"
          } >> "$GITHUB_OUTPUT"

      # The tag, held against the tree it names — before a tarball is built,
      # before an image moves, before a version number is burned (ADR 0037 D3).
      #
      # `version` above is `${ref#v}` and nothing else. Every string this
      # release publishes is derived from it: the docker tags, `RELEASE_VERSION`
      # into the tarball's filename, its archive root and its
      # `core-manifest.json`, and the npm versions of both packages. Not one of
      # those derivations reads a manifest, so **`v9.9.9` pushed onto any commit
      # reachable from `main` used to resolve, name its tarballs `9.9.9`, publish
      # both images and only then fail** — at `scripts/lib/npm-packages.mjs`'s
      # packed-manifest comparison, the single place in the repository that
      # compared a version against a different representation of itself, and the
      # last thing in the pipeline to run.
      #
      # That comparison keeps its place; it is now the second content check
      # rather than the only one, and this is the first. A beta tag is checked
      # by exactly the same call: the manifests carry the line, and
      # `v0.4.1-beta` is the beta of the line `0.4.1` (ADR 0036 C1, D1).
      #
      # Read at `sha` rather than by checking the tag out: this job has the
      # whole ref graph already, and moving the working tree to ask what a
      # manifest says is the expensive way to ask.
      - name: The tag agrees with the tree it names
        env:
          RELEASE_REF: ${{ steps.ref.outputs.ref }}
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/assert-version-agreement.mjs \
            --expected "$RELEASE_REF" \
            --git-ref "$SHA" \
            --source "the tag $RELEASE_REF"

      # The `latest` guard (D28) — the one that reaches end users. All three
      # surfaces come from here: `tags` below feeds the docker tag list,
      # `latest` feeds `gh release create --latest=` in `github-release`, and
      # `npm_tag` feeds `npm publish --tag` in `npm`. They are three renderings
      # of one decision taken in scripts/lib/release-latest.mjs, which is where
      # the rule is written down and unit-tested, because the failure is
      # silent, reaches every existing user, and lies dormant until the first
      # backport.
      #
      # npm is the surface that had to be added rather than fixed, and it is
      # the same defaulting bug in a third dialect: `npm publish` with no
      # `--tag` takes `latest`, as `gh release create` with no `--latest`
      # defaults `make_latest` to true. A dist-tag is mandatory, so unlike the
      # other two "withhold latest" here has to name a replacement — which is
      # why the module returns a tag rather than a boolean.
      #
      # The script's stdout is `key=value` and nothing else, so it pipes
      # straight into $GITHUB_OUTPUT; `tee` keeps it in the log, and its
      # reasoning goes to stderr.
      - id: tags
        env:
          MODE: ${{ steps.ref.outputs.mode }}
          RELEASE_VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-tags.mjs \
            --mode "$MODE" --version "$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"

      # Belt and braces, in D28's own words. The rule is already structural in
      # the module — a backport never reaches the comparison that could answer
      # `latest` — and it is re-asserted here because *these* are the values
      # that flow into the two publishing jobs, and because a guard that only
      # exists inside the thing it guards is one edit away from being gone.
      - name: A backport moves latest on none of the three surfaces
        env:
          MODE: ${{ steps.ref.outputs.mode }}
          TAGS: ${{ steps.tags.outputs.tags }}
          LATEST: ${{ steps.tags.outputs.latest }}
          NPM_TAG: ${{ steps.tags.outputs.npm_tag }}
          RELEASE_REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # An empty dist-tag would reach `npm publish --tag ""`, which npm
          # rejects — but only after the images are out, so it is decided here
          # with everything else.
          if [[ -z "$NPM_TAG" ]]; then
            echo "::error title=No npm dist-tag resolved::scripts/release-tags.mjs emitted no npm_tag for $RELEASE_REF. Every publish to npm lands under some dist-tag, so an empty one is not 'no tag' — it is a release that the registry refuses, after both images have already shipped."
            exit 1
          fi
          if [[ "$MODE" != "backport" ]]; then
            echo "$MODE $RELEASE_REF: the highest-version test decided latest=$LATEST, publishing '$TAGS' and npm dist-tag '$NPM_TAG'."
            exit 0
          fi
          for tag in $TAGS; do
            if [[ "$tag" == "latest" ]]; then
              echo "::error title=A backport must never move latest::Backport $RELEASE_REF resolved the docker tags '$TAGS'. Publishing an old line's patch as :latest moves every operator's \`docker pull\` backwards, with no history to roll back to (ADR 0023 D28)."
              exit 1
            fi
          done
          if [[ "$LATEST" != "false" ]]; then
            echo "::error title=A backport must never be the GitHub latest release::Backport $RELEASE_REF resolved latest=$LATEST. /releases/latest is what install.sh installs by default and what the in-product update checker compares against, so this would tell every user on a newer line to downgrade (ADR 0023 D28)."
            exit 1
          fi
          if [[ "$NPM_TAG" == "latest" ]]; then
            echo "::error title=A backport must never take the npm latest dist-tag::Backport $RELEASE_REF resolved the npm dist-tag '$NPM_TAG'. \`npm i @actana/sdk\` resolves the \`latest\` dist-tag, so this hands every consumer an old line's patch as a downgrade on their next install — the same failure as the other two surfaces, on the one that reaches people without them asking for anything (ADR 0023 D28)."
            exit 1
          fi
          echo "✅ backport $RELEASE_REF publishes '$TAGS', passes --latest=false, and takes the npm dist-tag '$NPM_TAG'. None of the three surfaces moves."

      # D31, amended by ADR 0018: Docker Hub is the only registry, so missing
      # credentials mean the images have nowhere to go — on any repo, fork or
      # not. The same one PAT serves both the `docker login` in
      # container-image.yml and the description API housekeeping.yml calls: an
      # organization access token can push images but answers "Cannot log into
      # an organization account" on POST /v2/users/login, so it would mean
      # paying for Team or Business *and still* provisioning a PAT.
      #
      # Checked before anything is built, deliberately — unlike a *broken*
      # credential, a missing one costs nothing to catch early.
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$DOCKERHUB_TOKEN" && -n "$DOCKERHUB_USERNAME" ]]; then
            exit 0
          fi
          echo "::error title=Missing Docker Hub credential::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must both be set — Docker Hub is the only registry the images are published to, so a release without them is not a release. One personal access token (Read & Write, from an account with Admin on the org) serves both the image push and the description sync. See docs/REPO_SETUP.md section 2."
          exit 1

      # The same shape as the check above, for the second registry (#129 D13,
      # ADR 0018 as amended). It is deliberately a copy rather than a merged
      # "credentials" step: the two failures are different sentences, and an
      # operator who has just added npm to a working release needs to be told
      # which one is missing, not that "a credential" is.
      #
      # Being *here* is the whole point. `npm` is the last job in the graph —
      # after both images are published — so a missing token discovered at the
      # publish itself would be discovered with `x.y.z` and `latest` already
      # re-pointed on Docker Hub and nothing on npm: a release that is half out,
      # in the one direction that cannot be undone by re-running it. Fifteen
      # seconds into `resolve`, nothing has been built and nothing published.
      - name: Require an npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$NPM_TOKEN" ]]; then
            exit 0
          fi
          echo "::error title=Missing npm token::NPM_TOKEN must be set — npm is a release registry alongside Docker Hub (ADR 0018 as amended by #159), and @actana/sdk and @actana/cli publish on this tag at this version. An automation token with Read and write on the @actana scope, from an account with Owner on it: \`gh secret set NPM_TOKEN --repo actana/control\`. See docs/REPO_SETUP.md section 2."
          exit 1

  # The two Linux legs. The mac leg is `tarball-macos` below rather than a third
  # row here. It was split when it carried the approval environment — a
  # job-level key that a matrix cannot express per row, and `needs:` waits on a
  # matrix job whole, so the pause would have held `installer-e2e` behind a
  # human for no reason. The environment is gone (ADR 0023 D15) and the split
  # stays: the mac leg bills at 10×, and keeping it out of this matrix is what
  # lets the Linux legs and the installer e2e run without waiting on it.
  tarball:
    name: Core tarball (${{ matrix.target }})
    needs: resolve
    strategy:
      # Let both legs finish so one failure surfaces both in a single run.
      # Publishing still requires the pair: a SHA256SUMS covering one
      # architecture is worse than no release, so `github-release` needs this
      # job whole.
      fail-fast: false
      matrix:
        # Every target builds on a runner of its own architecture: the tarballs
        # carry prebuilt native modules (node-pty, better-sqlite3) copied from
        # the build host's own install, so a cross-compiled leg would be a
        # guess, not a build.
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both bundles, not just the daemon's: the tarball stages
      # `app/core-entry.cjs` from `packages/core/dist` and `app/actana-cli.cjs`
      # from `packages/cli/dist-tarball` (#288 D1), and
      # `scripts/build-core-tarball.mjs` fails without either. One script names
      # the pair so this step and `pnpm core:tarball` cannot drift apart;
      # `scripts/__tests__/core-tarball.test.mjs` asserts every caller uses it.
      - name: Build the Core tarball's bundles
        run: pnpm build:core-tarball-bundles

      - name: Build the tarball
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          node scripts/build-core-tarball.mjs \
            --target "$TARGET" \
            --version "$RELEASE_VERSION" \
            --out-dir artifacts/core

      # The acceptance criterion, run on the platform it is about: extract the
      # tarball and boot it through its own launcher with no system Node.
      - name: Smoke — extracted tarball boots a dialable Core
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          node scripts/smoke-core-tarball.mjs \
            --tarball "artifacts/core/actana-core-$RELEASE_VERSION-$TARGET.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-tarball-${{ matrix.target }}
          path: artifacts/core/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The macOS Core tarball — the only macOS minutes this repository spends
  # (ADR 0016 D28, as amended). It is release-only and never runs on a pull
  # request: macOS runners bill at 10×, and three macOS legs were once 72% of
  # the whole CI bill (D35). One leg, on a release cadence.
  #
  # It used to declare `environment: macos-release`, which held it — and
  # therefore every publishing job downstream of it — until a human had run
  # docs/core-macos-prerelease-checklist.md on real Apple hardware. **That
  # environment is gone from here (ADR 0023 D15), and the pause is not.** It
  # moved to the head of `promote.yml`, upstream of this whole workflow, which
  # puts the fast-forward onto `main` downstream of the human as well: `main`
  # never contains unapproved code, where before it already did by the time
  # anyone was asked. Exactly one pause exists, and this is no longer it.
  #
  # The reviewer therefore builds their macOS tarball from the train tip rather
  # than from a tag that does not exist yet. By D16's assertion that is the
  # same commit, and it is available earlier, which is strictly better for
  # them. The checklist itself is unchanged and still the gate — it is simply
  # worked before the promotion is dispatched.
  #
  # macos-15 is Apple silicon (macos-15-intel is the Intel label), which is what
  # makes this a build rather than a cross-compile: node-pty's darwin-arm64
  # prebuild and the better-sqlite3 binding both come off the build host.
  tarball-macos:
    name: Core tarball (mac-arm64)
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TARGET: mac-arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both bundles, not just the daemon's: the tarball stages
      # `app/core-entry.cjs` from `packages/core/dist` and `app/actana-cli.cjs`
      # from `packages/cli/dist-tarball` (#288 D1), and
      # `scripts/build-core-tarball.mjs` fails without either. One script names
      # the pair so this step and `pnpm core:tarball` cannot drift apart;
      # `scripts/__tests__/core-tarball.test.mjs` asserts every caller uses it.
      - name: Build the Core tarball's bundles
        run: pnpm build:core-tarball-bundles

      - name: Build the tarball
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          node scripts/build-core-tarball.mjs \
            --target "$TARGET" \
            --version "$RELEASE_VERSION" \
            --out-dir artifacts/core

      # The same acceptance criterion the Linux legs run, on the platform it is
      # about: extract the tarball and boot it through its own launcher with no
      # system Node. It is not a substitute for the human checklist — a runner
      # cannot reboot, log out, or meet Gatekeeper.
      - name: Smoke — extracted tarball boots a dialable Core
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          node scripts/smoke-core-tarball.mjs \
            --tarball "artifacts/core/actana-core-$RELEASE_VERSION-$TARGET.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-tarball-mac-arm64
          path: artifacts/core/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The arm64 half of the installer matrix (ADR 0016 D36). Ubuntu and Debian at
  # x64 run on every pull request in ci.yml; arm64 runs here, once per release,
  # because what only this matrix can catch — PAM, polkit, the logind rules
  # behind a sudo-less `systemctl --user` and `loginctl enable-linger` — varies
  # by distro rather than by architecture, and the arch-sensitive risk (prebuilt
  # native modules) is already covered by the tarball smoke on every PR.
  #
  # It gates `github-release` on purpose: an arm64 tarball that cannot be
  # installed by the one-liner is not a release asset worth attaching.
  #
  # The axes are declared in scripts/lib/container-matrix.mjs, and
  # scripts/__tests__/container-matrix.test.mjs reads this file to check the two
  # still agree.
  installer-e2e:
    name: E2E — installer (${{ matrix.distro }}, ${{ matrix.arch }})
    needs: [resolve, tarball]
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian]
        arch: [arm64]
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: false

      # Only `ws` is needed — the e2e's core-link dial is the sole dependency it
      # has on the repo's own node_modules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-tarball-${{ matrix.target }}
          path: artifacts/core

      - name: E2E — the one-liner and the lifecycle on a fresh systemd machine
        run: |
          set -euo pipefail
          node scripts/e2e-actana-setup-linux.mjs \
            --tarball "artifacts/core/actana-core-${{ needs.resolve.outputs.version }}-${{ matrix.target }}.tar.gz" \
            --distro ${{ matrix.distro }}

  # The two image jobs, in whichever of the two modes `resolve` picked.
  #
  # In **promote** mode neither builds anything: `container-image.yml` pulls
  # the `beta-x.y.z` digest, asserts its `org.opencontainers.image.revision`
  # label equals the promoted commit, and only then re-points `<version>` (and
  # `latest`, when the guard allows it) at that same digest with `docker
  # buildx imagetools create` — the command it already uses to stitch
  # multi-arch manifests. Seconds, and no bytes (ADR 0023 D16, D17).
  #
  # In **backport** mode they are the ordinary build-and-push path against the
  # release line, because no beta digest exists to promote (D26).
  #
  # They do not wait on the `tarball` job: container-image.yml builds the Core
  # tarball it bakes in itself, on the runner that will ship it.
  #
  # They *do* wait on `tarball-macos`. That used to be the approval gate; since
  # D15 moved the pause into `promote.yml` it is a different guarantee, and
  # still one worth having: a release is atomic or it is not a release. An
  # image and its `:latest` are not undoable, so publishing them before the
  # macOS leg has produced the tarball `github-release` needs would mean a
  # `:latest` pointing at a version whose GitHub Release is missing a third of
  # its assets — with `install.sh` reading exactly that Release.
  #
  # `name:` on both is pinned by the "Protect main" ruleset (the same two check
  # names ci.yml uses on pull requests). Renaming either blocks every pull
  # request in the repository until an admin updates the ruleset.
  panel:
    name: Panel image
    needs: [resolve, tarball-macos]
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      image: panel
      # The commit, not the tag. In promote mode this is what the beta
      # digest's revision label has to equal (D16); in backport mode it is what
      # gets checked out and built. A tag would resolve to the same object and
      # say less.
      ref: ${{ needs.resolve.outputs.sha }}
      stage: ${{ needs.resolve.outputs.version }}
      # Promote mode asserts the beta digest's own version label equals this
      # line before re-pointing anything at it; backport mode asserts the tree
      # it is about to build carries it (ADR 0037 D4). `resolve` already
      # asserted the tag against the tree, so this is the same fact checked on
      # the bytes rather than on the ref.
      version: ${{ needs.resolve.outputs.version }}
      mode: ${{ needs.resolve.outputs.image_mode }}
      source_tag: ${{ needs.resolve.outputs.source_tag }}
      tags: ${{ needs.resolve.outputs.tags }}
      push: true

  core:
    name: Core image
    needs: [resolve, tarball-macos]
    uses: ./.github/workflows/container-image.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      image: core
      ref: ${{ needs.resolve.outputs.sha }}
      stage: ${{ needs.resolve.outputs.version }}
      # Promote mode asserts the beta digest's own version label equals this
      # line before re-pointing anything at it; backport mode asserts the tree
      # it is about to build carries it (ADR 0037 D4). `resolve` already
      # asserted the tag against the tree, so this is the same fact checked on
      # the bytes rather than on the ref.
      version: ${{ needs.resolve.outputs.version }}
      mode: ${{ needs.resolve.outputs.image_mode }}
      source_tag: ${{ needs.resolve.outputs.source_tag }}
      tags: ${{ needs.resolve.outputs.tags }}
      push: true

  # npm, the second release registry (#129 D12, D13; ADR 0018 as amended by
  # #159). `@actana/sdk` and `@actana/cli` go out on the same tag that builds
  # the images, at the same version as everything else.
  #
  # ── Why it is last ───────────────────────────────────────────────────────────
  #
  # Every other publish in this workflow is re-doable. A Docker tag can be
  # re-pointed; the whole promote mode is built on that. `gh release upload
  # --clobber` overwrites an asset. **An npm version number is burned by its
  # first publish** — unpublishing inside the 72-hour window frees the bytes and
  # not the name, so `@actana/sdk@0.2.2` can never mean anything else, on any
  # future train, and the recovery is to burn the next number too.
  #
  # So this waits on everything: both tarball legs, the installer e2e, and both
  # image publishes. A CVE gate that fires, an arm64 tarball the one-liner
  # cannot install, a digest whose revision label names another commit — each of
  # those is a release that stops, and none of them should cost a version
  # number. Ordering it last is not caution about npm; it is the one job whose
  # failure mode the rest of the pipeline cannot absorb.
  #
  # It also sits downstream of the human, as every publishing job in this
  # workflow does. The pause is no longer the `macos-release` environment on
  # `tarball-macos` — ADR 0023 D15 moved it to the head of `promote.yml`, which
  # is upstream of this entire file, so "downstream of the approval" is now a
  # property of being in this workflow at all. `needs: tarball-macos` is kept
  # for the guarantee that survived the move: a release is atomic or it is not a
  # release.
  #
  # ── Provenance ───────────────────────────────────────────────────────────────
  #
  # `id-token: write` is what makes the attestation possible, and its absence is
  # the trap: `npm publish --provenance` in a job without it fails loudly, but a
  # publish that simply stopped passing `--provenance` would succeed, silently
  # unattested, and look identical in the log. Three things stand in the way of
  # that, deliberately overlapping — the flag here, `publishConfig.provenance`
  # inside the package (asserted by scripts/lib/npm-packages.mjs), and the
  # post-publish check below that reads the attestation back off the registry
  # and fails the release if it is not there.
  npm:
    name: npm publish
    needs: [resolve, tarball, tarball-macos, installer-e2e, panel, core]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Provenance. Without it the publish is unattested; see the header.
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
          # Writes an `.npmrc` under RUNNER_TEMP that reads `NODE_AUTH_TOKEN`,
          # and points `NPM_CONFIG_USERCONFIG` at it. The repository's own
          # `.npmrc` is untouched.
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pack, and assert the tarballs — the same rehearsal every pull request
      # runs through `pnpm test`, here re-run on the tag and against the version
      # being released, so what is asserted and what is published are the same
      # bytes rather than the same intent.
      #
      # `pnpm pack`, not `npm pack`: the SDK's working `exports` map points at
      # TypeScript source because inside the workspace it is consumed as source,
      # and `publishConfig.exports` — which pnpm applies at pack time and npm
      # does not — is what turns it into the compiled map a consumer resolves.
      - id: pack
        name: Rehearse the publish, on the tag
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/rehearse-npm-publish.mjs \
            --out-dir artifacts/npm \
            --version "$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"

      # One tarball at a time, with the already-published case handled rather
      # than raced: `workflow_dispatch` re-runs a whole release (D26, D30), and
      # on that path the registry already has this version. `npm publish` would
      # answer 403 and fail a release whose only fault is having succeeded
      # before — so an existing version is a notice, and the attestation check
      # below still runs against it.
      #
      # `--tag` is explicit and comes from `resolve` (D28). `npm publish` with
      # no `--tag` takes `latest`, which is the same default this file already
      # refuses for the docker tag list and for `gh release create --latest`;
      # a backport or an rc taking it would hand every consumer a downgrade on
      # their next `npm i`. The value is decided once in
      # scripts/lib/release-latest.mjs and re-asserted in `resolve`.
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALLS: ${{ steps.pack.outputs.tarballs }}
          PACKAGES: ${{ steps.pack.outputs.packages }}
          NPM_TAG: ${{ needs.resolve.outputs.npm_tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # The rehearsal emits both lists in publish order, so the names come
          # from where they were already computed rather than being read out of
          # each tarball a second time. Two sources for one fact drift; a
          # length mismatch means they already have.
          read -ra tarballs <<< "$TARBALLS"
          read -ra names <<< "$PACKAGES"
          if [[ "${#tarballs[@]}" -ne "${#names[@]}" ]]; then
            echo "::error title=Rehearsal outputs disagree::${#tarballs[@]} tarball(s) and ${#names[@]} package name(s). scripts/rehearse-npm-publish.mjs emits both in publish order and they are paired by position here."
            exit 1
          fi
          published=()
          for i in "${!tarballs[@]}"; do
            tarball="${tarballs[$i]}"
            spec="${names[$i]}@$RELEASE_VERSION"
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "::notice title=Already on npm::$spec is already published — this is a re-run, and an npm version is published exactly once. Leaving it alone; its attestation is verified below."
            else
              echo "Publishing $spec from $(basename "$tarball") under dist-tag '$NPM_TAG'"
              npm publish "$tarball" --provenance --access public --tag "$NPM_TAG"
            fi
            published+=("$spec")
          done
          printf '%s\n' "${published[@]}" > artifacts/npm/published.txt
          echo "Published or confirmed: ${published[*]} (dist-tag $NPM_TAG)"

      # The assertion that the flag above actually did something. A publish that
      # lost `--provenance` succeeds and reads as a normal publish in every log
      # line; the only place the difference is visible is the registry, so that
      # is where it is checked. Read back rather than trusted — with a couple of
      # retries, because the attestation is written by a different service than
      # the packument and can lag it by seconds.
      #
      # ── Two failure modes, and they must not be one ──────────────────────
      #
      # This step runs after the version number is burned, which makes it the
      # one place in this workflow where a false alarm is expensive: "restore
      # the attestation path and cut the next version" is right for an
      # unattested publish and a wasted version number for a registry that was
      # briefly unreachable. So `npm view`'s exit status is captured apart from
      # its output, and the two are reported as different failures:
      #
      #   * the query answered and the field is empty → **unattested**. The
      #     publish really did lose its provenance. Not retryable.
      #   * the query never answered at all → **unverified**. The publish may
      #     be perfectly attested; nothing here can tell. Re-runnable, and the
      #     re-run is cheap because an already-published version is a notice.
      #
      # Neither can wear the other's message. An empty string used to be both,
      # and `2>/dev/null || true` was what collapsed them.
      #
      # Separating the status is only half of it: the *output* has to be the
      # field and nothing else. `npm view <spec> <field>` prints nothing and
      # exits 0 when the field is absent, so with stderr folded in by `2>&1` a
      # single `npm warn` line is a non-empty answer — and this check's answer
      # to "is it attested" is "is the answer non-empty". stderr therefore goes
      # to its own file, and the value is required to look like the URI a
      # predicateType is.
      #
      # `NODE_AUTH_TOKEN` is set here for the same reason it is set on the
      # publish: `setup-node` wrote an `.npmrc` whose `_authToken` references
      # it, and with the variable unset npm sends the unexpanded literal as a
      # bearer token — a 401 on a read that needs no auth, which is the most
      # likely way this step reaches the "could not ask" branch at all.
      - name: Every published package is attested
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          unattested=()
          unverified=()
          # npm's stderr goes to its own file, never into the value being
          # tested. Folding it in with `2>&1` kept the error text for the
          # failure message below and cost the check its whole point: `npm view
          # <spec> <field>` prints *nothing* on stdout and exits 0 when the
          # field is absent, so any warning npm writes — `npm warn Unknown user
          # config` off the `.npmrc` setup-node wrote is the likely one — comes
          # back as a non-empty answer, and an emptiness test reads it as an
          # attestation. The one check that can catch a publish that lost
          # `--provenance` would have reported success on exactly the input it
          # exists to refuse.
          stderr="$(mktemp)"
          # `mapfile` rather than `while read < file`: the loop body runs `npm`,
          # and a command that touches stdin inside a `while read` loop eats the
          # list it is iterating.
          mapfile -t specs < artifacts/npm/published.txt
          for spec in "${specs[@]}"; do
            predicate=""
            answered=0
            error=""
            for attempt in 1 2 3 4 5; do
              # `set -e` does not fire inside an `if` condition, so a non-zero
              # `npm view` lands in the else branch rather than killing the
              # step — which is what keeps "it errored" separable from "it
              # answered, and the answer was empty".
              if output="$(npm view "$spec" dist.attestations.provenance.predicateType 2>"$stderr")"; then
                answered=1
                predicate="$(printf '%s' "$output" | tr -d '[:space:]')"
                # Belt to the braces above: a predicateType is a URI
                # (`https://slsa.dev/provenance/v1`), so anything that is not
                # one is not an attestation, whatever wrote it to stdout.
                if [[ -n "$predicate" && "$predicate" != https://* ]]; then
                  echo "  $spec: registry answered \"$predicate\", which is not a predicateType URI — not an attestation."
                  predicate=""
                fi
                # The registry answered. An absent attestation is retried only
                # because the attestation service lags the packument by
                # seconds, never because the read itself failed.
                [[ -n "$predicate" ]] && break
                echo "  $spec: registry answered, no attestation yet (attempt $attempt), waiting…"
              else
                answered=0
                error="$(tail -n 3 "$stderr" | tr '\n' ' ')"
                echo "  $spec: \`npm view\` failed (attempt $attempt) — ${error:-no output}; retrying…"
              fi
              sleep 10
            done
            if [[ -n "$predicate" ]]; then
              echo "✅ $spec — $predicate"
            elif [[ "$answered" -eq 1 ]]; then
              unattested+=("$spec")
            else
              unverified+=("$spec ($error)")
            fi
          done

          fail=0
          if [[ "${#unattested[@]}" -gt 0 ]]; then
            echo "::error title=Published without provenance::${unattested[*]} is on the registry, the registry answered for it, and it carries no provenance attestation. A publish that is missing \`--provenance\`, or that ran in a job without \`id-token: write\`, succeeds and looks exactly like this one did in the log — the registry is the only place the difference shows. This is not a retry: the version cannot be republished, and the fix is to restore the attestation path and cut the next version."
            fail=1
          fi
          if [[ "${#unverified[@]}" -gt 0 ]]; then
            echo "::error title=Could not verify provenance::\`npm view\` never answered for ${unverified[*]} after 5 attempts, so this step does not know whether the attestation is there. Do NOT cut a new version on the strength of this failure — the publish above succeeded and may well be attested. Check \`npm view <spec> dist.attestations\` by hand, and re-run this workflow on the same tag once the registry is reachable: an already-published version is treated as published, so the re-run costs nothing."
            fail=1
          fi
          exit "$fail"

  github-release:
    name: Attach tarballs + SHA256SUMS to the GitHub Release
    # The Release is the last thing to appear, after both images are published:
    # it is the announcement, and an announcement that precedes the images
    # sends operators to tags that are not there yet. `installer-e2e` is in
    # here for a different reason (D36): an arm64 tarball the one-liner cannot
    # install is not an asset worth attaching.
    #
    # `tarball-macos` is in here for a third: this job composes SHA256SUMS
    # across all three targets and refuses anything but four assets, so the mac
    # leg is a hard input rather than a nice-to-have. It is redundant as a
    # `needs:` — `panel` and `core` wait on it too, so it is already transitive
    # — and kept named because a `needs:` list is the only place a reader
    # learns what a job waits for. A SHA256SUMS covering a subset of the
    # architectures the docs promise is worse than a release that is late.
    #
    # `npm` is in here as of #159, and it is the one `needs:` in this list that
    # can hold the Release back over something already published. That is the
    # intended direction: the Release is the announcement, npm is the least
    # undoable thing the release does, and an announcement that precedes a
    # failed `npm publish` sends people to an `npm i` that 404s. The re-run path
    # (`workflow_dispatch` on the same tag) recreates every asset and treats an
    # already-published version as published, so a release stopped here is
    # resumable — which is the property that makes ordering it this way safe.
    needs: [resolve, tarball, tarball-macos, installer-e2e, panel, core, npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: core-tarball-*
          path: core-tarballs
          merge-multiple: true

      # --expect 3 is the guard, and the 3 is deliberate (D28, as amended): a
      # silently missing architecture must be a red build, not a checksum file
      # that quietly covers part of the release. It was 2 while macOS was
      # dropped, and 4 before that, when there were two macOS targets. It is
      # the count of CORE_TARGETS — the header of scripts/lib/core-tarball.mjs
      # lists this among the co-edits a new row requires.
      - name: Compose SHA256SUMS
        run: node scripts/compose-core-shasums.mjs --dir core-tarballs --expect 3

      - name: Verify SHA256SUMS the way an operator would
        working-directory: core-tarballs
        run: sha256sum -c SHA256SUMS

      # Exactly four assets. `install.sh` is not among them by design (D29) —
      # it is served from `main`, and adding it here would make a broken
      # installer fixable only by cutting a release.
      #
      # The upload path is create-or-upload idempotent, so it does not matter
      # whether the GitHub Release already exists when this runs.
      #
      # ── The second surface of the `latest` guard (ADR 0023 D28) ────────────
      #
      # `gh release create` was called here with no `--latest` flag at all, and
      # the API defaults `make_latest` to **true**. That default is what makes
      # a backport dangerous on this side: publishing `1.2.4` after `1.4.0`
      # would make `/releases/latest` answer `v1.2.4`, which is the endpoint
      # `install.sh` installs from by default and the one the in-product update
      # checker compares against — so every 1.4.x user would be told an older
      # version is available. `--latest` and `--prerelease` are therefore
      # always passed explicitly, from the same decision that produced the
      # docker tags, and never defaulted.
      #
      # `gh release edit` re-asserts both on the re-run path: `upload` cannot
      # express them, and a Release created by hand carries whatever GitHub
      # picked for it.
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ needs.resolve.outputs.ref }}
          RELEASE_MODE: ${{ needs.resolve.outputs.mode }}
          RELEASE_LATEST: ${{ needs.resolve.outputs.latest }}
          RELEASE_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # The same assertion `resolve` makes, at the surface it protects. A
          # release job that trusted an upstream output to still be right is
          # how the one guard that mattered gets bypassed by a later edit.
          if [[ "$RELEASE_LATEST" != "true" && "$RELEASE_LATEST" != "false" ]]; then
            echo "::error title=No explicit latest decision::resolve produced latest='$RELEASE_LATEST'. This flag is never defaulted — the API's default is true, which is the bug (ADR 0023 D28)."
            exit 1
          fi
          if [[ "$RELEASE_MODE" == "backport" && "$RELEASE_LATEST" != "false" ]]; then
            echo "::error title=A backport must never be the GitHub latest release::$RELEASE_REF is a backport and resolved --latest=$RELEASE_LATEST. /releases/latest is what the one-command installer resolves by default and what the in-product update checker compares against, so this would tell every user on a newer line to downgrade (ADR 0023 D28)."
            exit 1
          fi
          mapfile -t files < <(find core-tarballs -maxdepth 1 -type f \( -name '*.tar.gz' -o -name 'SHA256SUMS' \) | sort)
          if (( ${#files[@]} != 4 )); then
            echo "::error title=Wrong asset count::expected 4 assets (three tarballs + SHA256SUMS), found ${#files[@]}" >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          echo "Attaching ${#files[@]} asset(s) to $RELEASE_REF:"
          printf '  %s\n' "${files[@]}"
          echo "$RELEASE_MODE release: --latest=$RELEASE_LATEST --prerelease=$RELEASE_PRERELEASE"

          if gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            gh release upload "$RELEASE_REF" "${files[@]}" --clobber
            gh release edit "$RELEASE_REF" \
              --latest="$RELEASE_LATEST" \
              --prerelease="$RELEASE_PRERELEASE"
          else
            gh release create "$RELEASE_REF" "${files[@]}" \
              --title "$RELEASE_REF" \
              --latest="$RELEASE_LATEST" \
              --prerelease="$RELEASE_PRERELEASE" \
              --notes "Core tarballs for Linux and Apple-silicon macOS Cores. Verify with \`sha256sum -c SHA256SUMS\`."
          fi
