name: Container image

# The single implementation of "build a container image, prove it works,
# publish it". Callers pick which image via the `image` input:
#
#   panel → the Panel web service, from deploy/panel.Dockerfile
#   core  → the Core daemon, from deploy/core.Dockerfile
#
# and three callers reuse it, so the bytes a PR validates are built exactly the
# way the bytes a release publishes are:
#
#   ci.yml          → build + smoke, amd64 only, no push  (every PR)
#   images-edge.yml → :edge and :sha-<short>              (every push to main)
#   release.yml     → :<version> and :latest              (every v* tag)
#
# Each architecture builds natively on a runner of its own kind. The Panel
# image compiles better-sqlite3 during the build and the Core image bakes in a
# per-architecture Core tarball — emulating either under QEMU is slow and
# proves the wrong machine.
#
# Registries. GHCR always, authenticated with the workflow's own `github.token`,
# which GHCR accepts for packages owned by this repository. Docker Hub *as well*
# whenever the DOCKERHUB_TOKEN secret is set — absent it, every Docker Hub step
# is skipped and the run still succeeds on GHCR alone. That gating is what lets
# a fork build and release without any Docker Hub account. See docs/ci-cd.md.
#
# No `permissions:` block here on purpose. A reusable workflow may not request
# more than its caller granted — declaring `packages: write` made the PR build
# in ci.yml, which needs only `read`, fail at startup. The callers set what they
# need: `write` for the edge and release paths, `read` for the PR build.

on:
  workflow_call:
    inputs:
      image:
        description: "Which image to build: panel or core."
        type: string
        required: true
      ref:
        description: "Git ref to build."
        type: string
        required: true
      stage:
        description: "Discriminator for the intermediate per-arch tags (e.g. 0.1.0, edge)."
        type: string
        required: true
      tags:
        description: "Space-separated final tags to publish (e.g. '0.1.0 latest'). Ignored when push is false."
        type: string
        default: ""
      push:
        description: "Publish the image. False builds and smokes only."
        type: boolean
        default: true
      matrix:
        description: "JSON matrix of runners to build on."
        type: string
        default: '{"include":[{"os":"ubuntu-24.04","arch":"amd64"},{"os":"ubuntu-24.04-arm","arch":"arm64"}]}'
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    name: Resolve registries
    runs-on: ubuntu-24.04
    outputs:
      ghcr: ${{ steps.registries.outputs.ghcr }}
      dockerhub: ${{ steps.registries.outputs.dockerhub }}
      images: ${{ steps.registries.outputs.images }}
    steps:
      - id: registries
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
          # A repository variable, so a fork publishing under a different
          # Docker Hub org doesn't have to edit this file.
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            panel|core) ;;
            *) echo "unknown image '$IMAGE' — expected 'panel' or 'core'" >&2; exit 1 ;;
          esac

          # GHCR requires a lowercase namespace.
          ghcr="ghcr.io/${OWNER,,}/${IMAGE}"
          echo "ghcr=$ghcr" >> "$GITHUB_OUTPUT"

          images="$ghcr"
          if [[ -n "$DOCKERHUB_TOKEN" ]]; then
            namespace="${DOCKERHUB_NAMESPACE:-${OWNER,,}}"
            dockerhub="docker.io/${namespace,,}/${IMAGE}"
            echo "dockerhub=$dockerhub" >> "$GITHUB_OUTPUT"
            images="$images $dockerhub"
            echo "Publishing to GHCR and Docker Hub ($dockerhub)."
          else
            echo "dockerhub=" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_TOKEN is not set — publishing to GHCR only."
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    name: Build + smoke (${{ matrix.arch }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      # ---------------------------------------------------------------- panel

      # The OCI labels live in the Dockerfile so a local build carries them too;
      # only source/revision are passed in, so a fork links to the fork.
      - name: Build the Panel image
        if: inputs.image == 'panel'
        env:
          IMAGE: ${{ needs.resolve.outputs.ghcr }}
          STAGE: ${{ inputs.stage }}
          ARCH: ${{ matrix.arch }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          docker build \
            --file deploy/panel.Dockerfile \
            --build-arg "IMAGE_SOURCE=https://github.com/$REPO" \
            --build-arg "IMAGE_REVISION=$SHA" \
            --tag "$IMAGE:$STAGE-$ARCH" .

      # The acceptance criterion, against the exact bytes being released:
      # boot on a clean volume, first-boot setup, then destroy the container
      # and prove the volume alone carries the state.
      - name: Smoke — boots, sets up, survives container recreation
        if: inputs.image == 'panel'
        env:
          IMAGE: ${{ needs.resolve.outputs.ghcr }}
          STAGE: ${{ inputs.stage }}
          ARCH: ${{ matrix.arch }}
        run: node scripts/smoke-panel-image.mjs --image "$IMAGE:$STAGE-$ARCH" --skip-build

      # ----------------------------------------------------------------- core

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.image == 'core'
        with:
          version: 11.1.2
          cache: true

      - name: Install dependencies
        if: inputs.image == 'core'
        run: pnpm install --frozen-lockfile

      # The Core image bakes in the tarball a release ships, for this runner's
      # architecture — which is why the two arches cannot share a build.
      - name: Build the Core tarball
        if: inputs.image == 'core'
        run: pnpm core:tarball

      # The tarball arrives as a named build context rather than in the main
      # one, because artifacts/ is excluded by .dockerignore. The main context
      # is deploy/ and the Dockerfile reads nothing from it.
      #
      # This is a real Core, not the systemd fixture `deploy/dev/` used to
      # hold (ADR 0016 D40, which deleted it): no init system, no
      # --privileged, no host cgroup, and no provision script hardcoding a
      # hostname. The labels say so.
      - name: Build the Core image
        if: inputs.image == 'core'
        env:
          IMAGE: ${{ needs.resolve.outputs.ghcr }}
          STAGE: ${{ inputs.stage }}
          ARCH: ${{ matrix.arch }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --file deploy/core.Dockerfile \
            --build-context tarball=artifacts/core \
            --label "org.opencontainers.image.title=Actana Core" \
            --label "org.opencontainers.image.description=The Actana Control Core: the daemon a Panel pairs with, and the machine your agentic coding sessions run on. Set ACTANA_PUBLIC_HOST to the host your Panel will dial and mount a volume at /home/core, which holds the pairing identity, the database and each Harness's credentials. Harnesses (claude-code, codex, cursor-cli, opencode) install at runtime into that volume, not into the image." \
            --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "$IMAGE:$STAGE-$ARCH" \
            deploy

      # The Panel the image smoke pairs with. It is booted as the deployable —
      # `packages/panel/bin/panel.mjs` against the built server — rather than
      # pulled, because the Panel image for this commit is a different job's
      # output and may not exist yet on a PR.
      - name: Build the Panel
        if: inputs.image == 'core'
        run: pnpm build

      # The acceptance criterion for the Core image (ADR 0016 D36), against the
      # exact bytes being released: boot it unprivileged, prove tini is PID 1
      # and the daemon PID 2, prove the refused verbs refuse and name their
      # Docker equivalent, then pair a real Panel with it — and prove a restart
      # keeps that pairing while destroying the volume ends it.
      #
      # This is what replaced `panel-e2e-core-in-a-box`, which needed
      # --privileged and the host cgroup to boot a systemd fixture that no
      # longer exists. It does not replace the installer e2e, which shares
      # nothing with it but the daemon binary.
      - name: Smoke — the image boots unprivileged and a Panel pairs with it
        if: inputs.image == 'core'
        env:
          IMAGE: ${{ needs.resolve.outputs.ghcr }}
          STAGE: ${{ inputs.stage }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64) target=linux-x64 ;;
            arm64) target=linux-arm64 ;;
            *) echo "unmapped arch $ARCH" >&2; exit 1 ;;
          esac
          node scripts/smoke-core-image.mjs \
            --image "$IMAGE:$STAGE-$ARCH" --skip-build --target "$target"

      # The CVE gate (ADR 0016 D11, D37), on the built image rather than on a
      # lockfile — `pnpm audit` cannot see the base layer at all. It runs
      # before the push for the same reason the smoke does: an image that
      # fails the gate must not reach a registry.
      #
      # Fixable CRITICAL/HIGH fail; unfixed findings and medium/low are
      # reported. The one suppression is the checked-in .trivyignore.rego.
      #
      # Trivy arrives as its own release tarball, checked against that
      # release's published checksums — the same "a download we verify, not a
      # publisher we trust" posture core.Dockerfile takes with Node (D8), and
      # the reason this is not `curl … install.sh | sh`. Pinning the version
      # also pins the *scanner*, so a finding count only moves when a
      # deliberate bump moves it.
      #
      # `always()` reports the gate even when the smoke above failed, which is
      # not the same as blessing an image that did not boot: `Push the per-arch
      # tags` carries a bare `if: inputs.push`, so a failed step earlier in the
      # job keeps it skipped whatever the scanner says. Without it, D11's
      # measurement is hostage to an unrelated leg — a red smoke means nobody
      # sees the finding count at all.
      - name: Trivy — fixable CRITICAL/HIGH gate
        if: always() && inputs.image == 'core'
        env:
          IMAGE: ${{ needs.resolve.outputs.ghcr }}
          STAGE: ${{ inputs.stage }}
          ARCH: ${{ matrix.arch }}
          TRIVY_VERSION: 0.73.0
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64) trivy_arch=Linux-64bit ;;
            arm64) trivy_arch=Linux-ARM64 ;;
            *) echo "unmapped arch $ARCH" >&2; exit 1 ;;
          esac
          archive="trivy_${TRIVY_VERSION}_${trivy_arch}.tar.gz"
          dist="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$dist/$archive"
          curl -fsSLO "$dist/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${archive}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p bin && tar -xzf "$archive" -C bin trivy
          cd "$GITHUB_WORKSPACE"
          PATH="$RUNNER_TEMP/bin:$PATH" node scripts/scan-core-image.mjs \
            --image "$IMAGE:$STAGE-$ARCH" --json "$RUNNER_TEMP/trivy-core.json"

      # Always, including on a failed gate: the JSON is how somebody works out
      # what to bump without re-running the build to see it.
      - name: Keep the scan
        if: always() && inputs.image == 'core'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-core-${{ inputs.stage }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/trivy-core.json
          if-no-files-found: ignore

      # --------------------------------------------------------------- shared

      - name: Push the per-arch tags
        if: inputs.push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_IMAGE: ${{ needs.resolve.outputs.ghcr }}
          IMAGES: ${{ needs.resolve.outputs.images }}
          STAGE: ${{ inputs.stage }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin

          # GHCR is the primary registry and it has already authenticated, so a
          # Docker Hub credential problem must not take the release down with
          # it: push what we can, then fail at the end with the reason. Failing
          # here instead would leave GHCR unpublished because a *mirror* was
          # misconfigured.
          dockerhub_ok=1
          if [[ -n "$DOCKERHUB_TOKEN" ]]; then
            if ! echo "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin; then
              dockerhub_ok=0
              echo "::error title=Docker Hub login failed::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN were rejected. The username depends on which kind of token you made. ORGANISATION access token (created under the org, app.docker.com/accounts/<org>): DOCKERHUB_USERNAME must be the ORGANISATION NAME — an OAT authenticates as the org, not as the person who created it, and OATs need a Team or Business subscription. PERSONAL access token (Account settings > Personal access tokens): DOCKERHUB_USERNAME is your own username, and that account needs push rights on the target repos. Either way the token needs Read & Write, and an account password will never work. GHCR was published; Docker Hub was not."
            fi
          fi

          for image in $IMAGES; do
            if [[ "$image" == docker.io/* && "$dockerhub_ok" -eq 0 ]]; then
              echo "Skipping $image — Docker Hub login failed."
              continue
            fi
            # The image was built under the GHCR name; retag for any other registry.
            if [[ "$image" != "$GHCR_IMAGE" ]]; then
              docker tag "$GHCR_IMAGE:$STAGE-$ARCH" "$image:$STAGE-$ARCH"
            fi
            docker push "$image:$STAGE-$ARCH"
          done

          # Deliberately not `exit 1` here: the publish job needs this one to
          # succeed, and failing now would leave GHCR with per-arch tags and no
          # manifest. The run is failed at the end of publish instead, once
          # GHCR is completely published.

  publish:
    name: Publish the multi-arch manifest
    if: inputs.push
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Stitch per-arch tags into the release tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGES: ${{ needs.resolve.outputs.images }}
          IMAGE_KIND: ${{ inputs.image }}
          MATRIX: ${{ inputs.matrix }}
          STAGE: ${{ inputs.stage }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          if [[ -z "${TAGS// }" ]]; then
            echo "no tags requested for a pushing build" >&2
            exit 1
          fi
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin

          # Same posture as the build job: GHCR is finished no matter what
          # Docker Hub does, and the run is failed at the very end if Docker
          # Hub was configured but unusable.
          dockerhub_ok=1
          if [[ -n "$DOCKERHUB_TOKEN" ]]; then
            if ! echo "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin; then
              dockerhub_ok=0
              echo "::error title=Docker Hub login failed::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN were rejected. DOCKERHUB_USERNAME must be the Docker Hub *account* that owns the access token — not the organisation name. If you publish under an org, set DOCKERHUB_USERNAME to your user account and DOCKERHUB_NAMESPACE to the org. The token needs Read & Write. GHCR was published; Docker Hub was not."
            fi
          fi

          # The arch list comes from the same matrix the build job used, so a
          # caller that builds one arch produces a one-arch manifest rather
          # than referencing a tag that was never pushed.
          arches="$(echo "$MATRIX" | jq -r '.include[].arch' | tr '\n' ' ')"

          for image in $IMAGES; do
            if [[ "$image" == docker.io/* && "$dockerhub_ok" -eq 0 ]]; then
              echo "Skipping $image — Docker Hub login failed."
              continue
            fi
            sources=()
            for arch in $arches; do sources+=("$image:$STAGE-$arch"); done
            tag_args=()
            for tag in $TAGS; do tag_args+=(--tag "$image:$tag"); done
            docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
            primary="$image:${TAGS%% *}"
            docker buildx imagetools inspect "$primary"

            # The Panel's HEALTHCHECK is a Docker extension to the OCI image
            # config, and a builder is free to drop it: podman does exactly
            # that, silently, without --format docker (ADR 0016 D23). The
            # build job already proved it on the per-arch image *before* that
            # image was pushed, which is the gate that can actually stop a
            # publish. This second check covers what that one cannot see —
            # the stitched manifest is a different artifact, assembled after
            # the per-arch tags exist — so it fails the run loudly rather
            # than leaving a healthcheck-less image tagged :latest unnoticed.
            if [[ "$IMAGE_KIND" == panel ]]; then
              config="$(docker buildx imagetools inspect "$primary" --format '{{json .Image}}')"
              # Multi-platform inspect keys the config by platform; a
              # single-platform one returns the config itself. Accept both.
              platforms="$(
                echo "$config" | jq -r '
                  if has("config") then {"(single)": .} else . end
                  | to_entries
                  | map(.key + "\t" + (
                      if ((.value.config.Healthcheck.Test // []) | join(" ")
                           | contains("/nodejs/bin/node"))
                      then "ok" else "MISSING" end))[]'
              )"
              # An empty map would otherwise satisfy "no platform is missing
              # it" without a single platform having been looked at.
              if [[ -z "$platforms" ]]; then
                echo "::error title=Could not read the published image config::imagetools inspect returned no platforms for $primary, so the healthcheck could not be confirmed either way." >&2
                exit 1
              fi
              if grep -q MISSING <<<"$platforms"; then
                echo "::error title=Published image has no healthcheck::$primary is missing the /nodejs/bin/node HEALTHCHECK. The builder dropped it between the per-arch build and the manifest. Per platform:%0A$(sed 's/$/%0A/' <<<"$platforms" | tr -d '\n')" >&2
                exit 1
              fi
              echo "$primary carries its healthcheck on every platform:"
              echo "$platforms"
            fi
          done

          # Configured but broken is a failure — just not one that costs GHCR.
          [[ "$dockerhub_ok" -eq 1 ]] || exit 1
