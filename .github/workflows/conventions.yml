# Enforces the repo conventions on every PR:
#   1. PR title follows Conventional Commits (it becomes the squash-merge subject)
#   2. Every commit message in the PR follows Conventional Commits (commitlint)
#   3. Branch name follows the branch naming convention
#
# A PR that fails any of these cannot be merged — add these three jobs as
# required status checks in the branch ruleset (docs/REPO_SETUP.md).
#
# The title check runs the PR title through the same commitlint.config.mjs the
# commit check uses, rather than a third-party action. One rule set, one place
# to change it, and no unpinned third-party code reading pull-request context.
#
# commitlint is installed into RUNNER_TEMP, never into the checkout: this is a
# pnpm workspace, and the root package.json declares `workspace:*` dependencies
# that npm cannot parse ("EUNSUPPORTEDPROTOCOL"). Installing beside the config
# copy keeps `extends: ['@commitlint/config-conventional']` resolvable, and
# `--cwd` points commitlint back at the checkout for its git queries.

name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install commitlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/commitlint"
          cp commitlint.config.mjs "$RUNNER_TEMP/commitlint/"
          cd "$RUNNER_TEMP/commitlint"
          npm init -y >/dev/null
          npm install --silent @commitlint/cli @commitlint/config-conventional
      # Via the environment, never inline in the script — a PR title is
      # attacker-controlled text and must not be interpolated into a shell.
      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_TITLE" | "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" \
            --config "$RUNNER_TEMP/commitlint/commitlint.config.mjs" \
            --cwd "$GITHUB_WORKSPACE" --verbose

  commit-messages:
    name: Commit messages (commitlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install commitlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/commitlint"
          cp commitlint.config.mjs "$RUNNER_TEMP/commitlint/"
          cd "$RUNNER_TEMP/commitlint"
          npm init -y >/dev/null
          npm install --silent @commitlint/cli @commitlint/config-conventional
      - name: Lint commits in PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" \
            --config "$RUNNER_TEMP/commitlint/commitlint.config.mjs" \
            --cwd "$GITHUB_WORKSPACE" \
            --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  branch-name:
    name: Branch name convention
    runs-on: ubuntu-24.04
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Allowed: <type>/<kebab-case-description>
          # Examples: feat/PROJ-123-oauth-device-flow, fix/header-crash, release/v1.4.0
          PATTERN='^(feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|perf|test|ci|revert)\/[a-z0-9]+([._-][a-z0-9]+)*$'

          # Bots name their own branches and cannot be asked to stop. Dependabot
          # opens `dependabot/npm_and_yarn/<dep>-<version>`; without this the
          # convention check fails on every dependency PR forever, which trains
          # everyone to ignore a red check. Their *commit messages* are still
          # linted by the job above — that is the part that reaches main.
          if echo "$BRANCH" | grep -qE '^(dependabot|renovate)/'; then
            echo "✅ Branch name '$BRANCH' is bot-generated — convention not enforced."
            exit 0
          fi

          if echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "✅ Branch name '$BRANCH' is valid."
          else
            echo "❌ Branch name '$BRANCH' violates the convention."
            echo ""
            echo "Expected: <type>/<kebab-case-description>"
            echo "Types: feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|perf|test|ci|revert"
            echo "Examples: feat/proj-123-oauth-device-flow, fix/header-crash, release/v1.4.0"
            echo "Rules: lowercase only; words separated by hyphens; no consecutive/leading/trailing separators."
            exit 1
          fi
