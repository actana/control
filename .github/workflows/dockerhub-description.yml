name: Docker Hub descriptions

# Docker Hub does not pull a README from GitHub on its own — the repository
# description is a field you PATCH through its API. This syncs one file per
# image, so `actana/panel` and `actana/core` each get their own page rather
# than sharing the source repo's README (which is what GHCR shows, and which
# describes the project rather than either image).
#
#   docs/images/panel.md → docker.io/<ns>/panel
#   docs/images/core.md  → docker.io/<ns>/core
#
# ── Why a separate credential ────────────────────────────────────────────────
# NOT the DOCKERHUB_TOKEN the image push uses. That is an organization access
# token, and OATs cannot authenticate to /v2/users/login — it answers
# "Cannot log into an organization account". This API needs a PERSONAL access
# token (read/write/delete) belonging to a user with Admin on the org.
#
# Absent DOCKERHUB_DESCRIPTION_TOKEN the job no-ops with a notice, exactly like
# the image push does without DOCKERHUB_TOKEN — a fork must not fail here.
#
# Done with curl rather than a third-party action on purpose: this step handles
# a credential that can rewrite the public face of both images, and the repo
# pins every action it does trust by SHA.

on:
  push:
    branches:
      - main
    paths:
      - "docs/images/**"
      - ".github/workflows/dockerhub-description.yml"
  workflow_dispatch:

concurrency:
  group: dockerhub-description
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync descriptions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Push each image's README to Docker Hub
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          OWNER: ${{ github.repository_owner }}
          USERNAME: ${{ secrets.DOCKERHUB_DESCRIPTION_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$TOKEN" ]]; then
            echo "::notice title=Docker Hub descriptions skipped::DOCKERHUB_DESCRIPTION_TOKEN is not set. See docs/REPO_SETUP.md section 2."
            exit 0
          fi
          if [[ -z "$USERNAME" ]]; then
            echo "::error title=Missing username::DOCKERHUB_DESCRIPTION_TOKEN is set but DOCKERHUB_DESCRIPTION_USERNAME is not. It must be the personal account that owns the token, not the organisation."
            exit 1
          fi

          namespace="${DOCKERHUB_NAMESPACE:-${OWNER,,}}"
          namespace="${namespace,,}"

          # A JWT, not the token itself — the /v2/repositories/ endpoints do not
          # accept a raw PAT.
          jwt="$(jq -n --arg u "$USERNAME" --arg p "$TOKEN" '{username:$u,password:$p}' \
            | curl -sS -X POST -H 'Content-Type: application/json' -d @- \
                https://hub.docker.com/v2/users/login/ \
            | jq -r '.token // empty')"

          if [[ -z "$jwt" ]]; then
            echo "::error title=Docker Hub auth failed::Could not exchange DOCKERHUB_DESCRIPTION_USERNAME/TOKEN for a JWT. This endpoint rejects organization access tokens ('Cannot log into an organization account') — use a PERSONAL access token with read/write/delete scope, from an account with Admin on the org."
            exit 1
          fi

          # short: what shows in search results. full: the page body.
          # Docker Hub caps these at 100 and 25000 bytes; overflowing is a 400,
          # so fail with the length rather than a bare API error.
          sync() {
            local repo="$1" file="$2" short="$3"
            if [[ ! -f "$file" ]]; then
              echo "::error title=Missing description file::$file"
              return 1
            fi
            # Byte length, not ${#short}: that counts characters, and these
            # strings contain multibyte punctuation. Docker's limit is bytes.
            local short_bytes bytes
            short_bytes="$(printf '%s' "$short" | wc -c)"
            if (( short_bytes > 100 )); then
              echo "::error title=Short description too long::$repo is $short_bytes bytes, max 100"
              return 1
            fi
            bytes="$(wc -c < "$file")"
            if (( bytes > 25000 )); then
              echo "::error title=README too long::$file is $bytes bytes, max 25000"
              return 1
            fi

            local status
            status="$(jq -n --rawfile full "$file" --arg short "$short" \
                        '{full_description:$full, description:$short}' \
              | curl -sS -o /tmp/resp.json -w '%{http_code}' \
                  -X PATCH \
                  -H "Authorization: JWT $jwt" \
                  -H 'Content-Type: application/json' \
                  -d @- \
                  "https://hub.docker.com/v2/repositories/${namespace}/${repo}/")"

            if [[ "$status" != "200" ]]; then
              echo "::error title=Failed to update $repo::HTTP $status — $(cat /tmp/resp.json)"
              return 1
            fi
            echo "✅ ${namespace}/${repo} — $bytes bytes of README, short description set"
          }

          rc=0
          sync panel docs/images/panel.md \
            "Self-hosted web Panel for driving agentic coding work across your machines." || rc=1
          sync core docs/images/core.md \
            "DEVELOPMENT FIXTURE — a containerised Actana Core for trying the pairing flow locally." || rc=1
          exit "$rc"
