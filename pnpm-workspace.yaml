savePrefix: ""

packages:
  - "packages/*"

overrides:
  "@esbuild-kit/core-utils@3.3.2>esbuild": 0.28.1
  "esbuild": 0.28.1
  "lodash-es": 4.18.1
  "protobufjs@8.0.1": 8.0.2
  "shell-quote": ">=1.8.5"
  "tmp": ">=0.2.7"
  "undici": "8.12.3"
  "ws": ">=8.21.0"
  "form-data": ">=4.0.6"
  "vite": ">=8.0.16"
  "axios@>=1.15.2 <1.18.0": ">=1.18.0"
  "brace-expansion@1": ">=1.1.16 <2"
  "brace-expansion@2": ">=2.1.2 <3"
  "brace-expansion@5": ">=5.0.7 <6"
  "fast-uri@>=3.0.0 <=3.1.3": ">=3.1.4"
  "js-yaml@>=4.0.0 <4.3.2": ">=4.3.2 <5"
  "nanoid@<3.3.17": ">=3.3.17 <4"
  "tar@<=7.5.18": ">=7.5.19"
  # GHSA-p6vx-979v-rg4c / GHSA-jp82-f5mq-hwhp: seroval <1.6.3 via
  # @tanstack/react-router -> router-core. seroval-plugins is its matched pair.
  "seroval@<1.6.3": ">=1.6.3 <2"
  "seroval-plugins@<1.6.3": ">=1.6.3 <2"
  # Keep a single CodeMirror state/view copy so language extensions pass
  # instanceof checks (duplicate copies crash the file editor).
  "@codemirror/state": "6.7.0"
  "@codemirror/view": "6.43.0"

  # GHSA-mrhx-c7xc-m3w5 (zod <4.6.6): @actana/sdk 0.6.0-next.4 pins zod 3.25.76,
  # and no 3.x release is patched. The SDK uses zod only in its `search`
  # subpath, which this repo does not import.
  "@actana/sdk>zod": "4.6.7"
  "zod@4": "4.6.7"

# GHSA-vfj7-8cjw-p6xm (braces <=3.0.3): build-time only via panel →
# @tanstack/react-start → router-plugin → chokidar → braces. No patched npm
# release yet (latest 3.0.3). Built Panel image has neither chokidar nor braces.
# Remove this ignore when braces 3.0.4+ ships. Tracking: #659
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  better-sqlite3: true
  esbuild: true
  node-pty: true
  protobufjs: true
  puppeteer: true
